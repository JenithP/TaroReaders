<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; background: #f3eeff; overflow-x: hidden; }
  .fit { width: 100vw; max-width: 540px; margin: 0 auto; aspect-ratio: 1080 / 1350; position: relative; overflow: hidden; }
  .fit .card { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  a { color: inherit; text-decoration: none; }
  .btns { display: flex; flex-direction: column; gap: 22px; width: 100%; padding: 0 34px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 12px; height: 132px; border-radius: 30px; font-size: 36px; font-weight: 900; line-height: 1.15; text-align: center; }
  .btn small { display: block; font-size: 24px; font-weight: 500; opacity: .9; }
  .btn.dg { background: linear-gradient(135deg, #ff8a3d, #ff6f0f); color: #fff; box-shadow: 0 10px 24px rgba(255, 111, 15, .4); animation: pulse 2.2s ease-in-out infinite; }
  .btn.ig { background: linear-gradient(120deg, #feda75, #fa7e1e 30%, #d62976 60%, #962fbf 85%, #4f5bd5); color: #fff; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .btn.dg { animation: none; } }
  body { font-family: "Noto Sans KR", sans-serif; color: #2b1d52; }
  .card {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(circle at 12% 10%, #ffd9ec 0, transparent 38%),
      radial-gradient(circle at 92% 22%, #d9d0ff 0, transparent 40%),
      radial-gradient(circle at 80% 95%, #ffe6c9 0, transparent 40%),
      radial-gradient(circle at 10% 85%, #cfe8ff 0, transparent 38%),
      #f3eeff;
  }
  /* 반짝이 */
  .spark { position: absolute; color: #fff; text-shadow: 0 0 12px rgba(160, 120, 255, .8); }
  /* 상단 */
  .tag {
    position: absolute; left: 72px; top: 72px; display: flex; gap: 12px;
  }
  .chip {
    padding: 12px 24px; border-radius: 999px; font-size: 26px; font-weight: 700;
    background: #2b1d52; color: #fff;
  }
  .chip.line { background: rgba(255, 255, 255, .7); color: #2b1d52; border: 2px solid #2b1d52; }
  .script { position: absolute; left: 72px; top: 168px; font-family: "Playfair Display", serif; font-style: italic; font-size: 64px; color: #8b5cf6; }
  h1 {
    position: absolute; left: 68px; top: 248px; font-size: 110px; font-weight: 900; line-height: 1.06; letter-spacing: -4px;
  }
  h1 .hl { position: relative; z-index: 0; }
  h1 .hl::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 10px; height: 34px; background: #ffb8dc; z-index: -1; border-radius: 6px; }
  .sub { position: absolute; left: 74px; top: 530px; font-size: 34px; font-weight: 500; line-height: 1.5; color: #5b4a86; }

  /* 루미 */
  .lumi { position: absolute; right: 40px; top: 120px; height: 600px; filter: drop-shadow(0 20px 30px rgba(80, 50, 160, .25)); }
  .kkami { position: absolute; z-index: 2; right: 318px; top: 560px; height: 190px; filter: drop-shadow(0 10px 16px rgba(40, 20, 80, .25)); }
  .sticker {
    position: absolute; right: 60px; top: 96px; width: 150px; height: 150px; border-radius: 50%;
    background: #ffde7a; display: grid; place-items: center; text-align: center; transform: rotate(12deg);
    font-size: 26px; font-weight: 900; line-height: 1.15; color: #2b1d52; box-shadow: 0 10px 20px rgba(0, 0, 0, .12);
    border: 4px dashed rgba(43, 29, 82, .35);
  }

  /* 리딩 4번 강조 */
  .hero-pill {
    position: absolute; left: 56px; top: 520px; width: 620px; padding: 6px 28px 22px; border-radius: 34px; color: #fff;
    background: linear-gradient(115deg, #ff5fa8, #9d4dff); box-shadow: 0 18px 36px rgba(190, 70, 200, .4);
    transform: rotate(-1.5deg); border: 4px solid #fff;
  }
  .hero-pill .n { font-size: 50px; font-weight: 900; letter-spacing: -1px; line-height: 1.15; white-space: nowrap; }
  .hero-pill .n .k { font-size: 36px; letter-spacing: 0; margin-right: 4px; }
  .hero-pill .n b { font-size: 132px; color: #ffe27a; text-shadow: 0 6px 0 rgba(90, 30, 140, .35); vertical-align: -10px; margin: 0 2px; }
  .hero-pill .d { margin-top: 0; font-size: 28px; font-weight: 700; line-height: 1.4; }
  .hero-pill .d em { font-style: normal; color: #ffe27a; }
  .kbubble {
    position: absolute; z-index: 3; left: 778px; top: 708px; padding: 14px 22px; border-radius: 26px 26px 26px 6px;
    background: #fff; color: #2b1d52; font-size: 30px; font-weight: 900; line-height: 1.2; text-align: center;
    box-shadow: 0 8px 20px rgba(43, 29, 82, .18); border: 3px solid #2b1d52; transform: rotate(3deg);
  }
  .kbubble em { font-style: normal; color: #a35cff; }
  .kbubble::before { content: ""; position: absolute; left: -16px; bottom: 10px; border: 10px solid transparent; border-right: 14px solid #2b1d52; }
  .kbubble::after { content: ""; position: absolute; left: -10px; bottom: 12px; border: 8px solid transparent; border-right: 11px solid #fff; }
  /* 프로그램 칩 */
  .menu { position: absolute; left: 72px; top: 812px; display: flex; gap: 12px; }
  .menu span {
    padding: 10px 20px; border-radius: 18px; font-size: 25px; font-weight: 700;
    background: rgba(255, 255, 255, .75); border: 2px solid rgba(139, 92, 246, .25);
  }

  /* 하단 티켓 */
  .ticket {
    position: absolute; left: 56px; right: 56px; bottom: 56px; height: 400px; display: flex;
    border-radius: 40px; background: #2b1d52; color: #fff; overflow: hidden;
    box-shadow: 0 24px 50px rgba(43, 29, 82, .3);
  }
  .ticket .left { flex: 1; padding: 44px 48px; }
  .ticket .when { font-size: 50px; font-weight: 900; letter-spacing: -1px; }
  .ticket .when small { font-size: 32px; font-weight: 500; color: #cbbdf5; margin-left: 8px; }
  .ticket .where { margin-top: 8px; font-size: 32px; font-weight: 500; color: #e7defd; }
  .prices { margin-top: 34px; display: flex; gap: 16px; }
  .price { flex: 1; padding: 20px 22px; border-radius: 24px; background: rgba(255, 255, 255, .09); }
  .price p { font-size: 24px; color: #cbbdf5; font-weight: 500; }
  .price b { display: block; margin-top: 4px; font-size: 48px; font-weight: 900; color: #ffde7a; letter-spacing: -1px; }
  .price b small { font-size: 26px; font-weight: 700; }
  .ticket .perf { width: 0; border-left: 4px dashed rgba(255, 255, 255, .25); margin: 30px 0; position: relative; }
  .ticket .right { width: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .qr { width: 230px; height: 230px; padding: 12px; border-radius: 24px; background: #fff; }
  .qr img { width: 100%; height: 100%; display: block; }
  .scan { font-size: 25px; font-weight: 700; text-align: center; line-height: 1.35; }
  .scan em { font-style: normal; color: #ff9a4d; }
  .punch { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: #f3eeff; left: -30px; }
  .url { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 20px; color: #6f5aa8; font-weight: 500; letter-spacing: .3px; }
</style>
