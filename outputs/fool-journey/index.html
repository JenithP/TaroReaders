<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바보의 여행 · 인생카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--gold:#f4d27a;--gold2:#e8b84a;--txt:#f5f0ff;--muted:#b9addf;--violet:#7b5cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04041a;color:var(--txt);font-family:'Gowun Dodum',sans-serif;user-select:none;-webkit-user-select:none}
body{cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:50% 50%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 25%,#2c2163 0%,#161044 45%,#07071f 100%)}
#sky{position:absolute;inset:0;width:1600px;height:900px}
.layer{position:absolute;inset:0}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.ch{display:inline-block;white-space:pre}

/* ---------- cards ---------- */
.card{position:absolute;border-radius:14px;overflow:hidden;background:#111;
  box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,230,170,.25)}
.card>img{width:100%;height:100%;display:block}
.card>img.nx{position:absolute;inset:0;opacity:0}
.fhole{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:brightness(0) blur(1px);pointer-events:none}
.fman{position:absolute}
.fman img{width:100%;height:100%;display:block}
.fgif{position:absolute;filter:drop-shadow(0 0 12px rgba(255,230,150,.8)) drop-shadow(0 18px 18px rgba(0,0,0,.5))}
.fwalk{position:absolute;filter:url(#bluekey) drop-shadow(0 0 12px rgba(255,230,150,.8));transform-origin:50% 53%}
.cardvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px}
.shimmer{position:absolute;inset:-10% 0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,245,210,.55) 50%,transparent 70%);mix-blend-mode:screen}
.card.frozen>img{filter:grayscale(1) sepia(.3) brightness(.62) contrast(1.15)}
.frost{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(190,215,255,.22),rgba(255,255,255,0) 40%,rgba(190,215,255,.18) 70%,rgba(255,255,255,.05)),
   repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);
  box-shadow:inset 0 0 60px rgba(170,200,255,.35)}
.frost::after{content:'❚❚';position:absolute;right:18px;top:14px;font-size:22px;color:rgba(220,230,255,.6);letter-spacing:-4px}
.mask-fig{-webkit-mask-image:radial-gradient(ellipse 37% 43% at 50% 46%,#000 52%,transparent 73%);
  mask-image:radial-gradient(ellipse 37% 43% at 50% 46%,#000 52%,transparent 73%)}
.hole{position:absolute;inset:0;opacity:0;background:rgba(10,8,40,.62);
  -webkit-backdrop-filter:grayscale(1) blur(3px) brightness(.55);backdrop-filter:grayscale(1) blur(3px) brightness(.55)}
.trav{position:absolute}
.bob{position:absolute;inset:0;filter:drop-shadow(0 0 14px rgba(255,226,150,.8)) drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.cut{position:absolute;inset:0;background-size:100% 100%}

/* ---------- typography ---------- */
.t-title{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:66px;color:var(--gold);
  text-shadow:0 0 26px rgba(244,210,122,.55)}
.t-sub{position:absolute;text-align:center;font-size:30px;color:#dcd3ff}
.hint{position:absolute;right:28px;bottom:20px;font-size:20px;color:rgba(244,210,122,.85);letter-spacing:.1em;z-index:80;
  opacity:0;transition:opacity .4s;pointer-events:none}
.hint.on{opacity:1;animation:hintp 1.6s ease-in-out infinite}
@keyframes hintp{50%{transform:translateX(6px);opacity:.5}}
.backc{position:absolute;left:24px;top:18px;z-index:90;padding:8px 16px;border-radius:999px;font:inherit;font-size:18px;cursor:pointer;
  background:rgba(20,14,50,.6);border:1px solid rgba(244,210,122,.55);color:#f4d27a;opacity:0;pointer-events:none;transition:opacity .4s}
.backc.on{opacity:.7;pointer-events:auto}.backc.on:hover{opacity:1;background:rgba(244,210,122,.15)}
.spd{position:absolute;right:24px;top:18px;z-index:90;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;
  background:rgba(20,14,50,.55);border:1px solid rgba(244,210,122,.35);color:#dcd3ff;font-size:17px;opacity:0;pointer-events:none;transition:opacity .4s}
.spd.on{opacity:.45;pointer-events:auto}.spd.on:hover{opacity:1}
.spd button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(244,210,122,.6);background:transparent;color:#f4d27a;font-size:20px;line-height:1;cursor:pointer}
.spd button:hover{background:rgba(244,210,122,.18)}
.spd b{min-width:52px;text-align:center;color:#f4d27a;font-weight:700}
.nav{position:absolute;left:28px;bottom:20px;display:flex;gap:8px;z-index:80;pointer-events:none}
.nav i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .4s}
.nav i.on{background:var(--gold);box-shadow:0 0 10px var(--gold);width:26px;border-radius:6px}

/* ---------- journey ---------- */
.jinfo{position:absolute;opacity:0}
.jinfo .act{font-size:28px;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
.jinfo .row{display:flex;align-items:baseline;gap:34px}
.jinfo .num{font-family:'Gowun Batang',serif;font-weight:700;font-size:160px;line-height:1;color:#fff;
  text-shadow:0 0 34px rgba(170,150,255,.75);min-width:200px}
.jinfo .name{font-family:'Gowun Batang',serif;font-weight:700;font-size:86px;line-height:1.1}
.jinfo .en{font-size:24px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:10px}
.jinfo .kw{display:inline-block;margin-top:26px;font-size:42px;color:#2b1d00;background:linear-gradient(90deg,#f7dc8e,#e9b94b);
  padding:8px 30px;border-radius:40px;font-weight:700}
.jinfo .tip{margin-top:36px;font-size:30px;color:#fff;opacity:0}
.track{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none;opacity:0}
.mini{position:absolute;width:50px;height:75px;border-radius:5px;background-size:100% 100%;opacity:.22;filter:grayscale(1);
  transition:opacity .3s,filter .3s,transform .3s,box-shadow .3s}
.mini.on{opacity:.95;filter:none}
.mini.cur{transform:translateY(-16px) scale(1.3);box-shadow:0 0 18px var(--gold);opacity:1;z-index:2}
.actlab{position:absolute;font-size:19px;color:var(--muted);text-align:center;border-top:2px solid rgba(185,173,223,.35);padding-top:4px;transition:color .3s,border-color .3s}
.twalk{position:absolute;transform:scaleX(-1);transition:left .5s linear;filter:drop-shadow(0 0 6px rgba(255,230,150,.7));z-index:3}
.twalk.still{object-fit:cover;object-position:50% 40%}
.track.pick .mini{pointer-events:auto;cursor:pointer}
.track.pick .mini:hover{opacity:1;filter:none;box-shadow:0 0 12px var(--gold)}
.mini.sel{outline:3px solid var(--gold);outline-offset:2px;opacity:1;filter:none}
.zcard{position:absolute;z-index:60;border-radius:14px;background-size:100% 100%;cursor:pointer;
  box-shadow:0 0 0 4px rgba(244,210,122,.9),0 0 60px rgba(244,210,122,.55),0 30px 60px rgba(0,0,0,.6)}
.zcard .zl{position:absolute;left:0;right:0;bottom:-58px;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:34px;color:var(--gold);
  text-shadow:0 0 18px rgba(0,0,0,.9)}
.actlab.on{color:var(--gold);border-color:var(--gold)}
.wcrop{position:absolute}
.wcrop .in{position:absolute;inset:0}

/* ---------- magic wand ---------- */
.mwand{position:absolute;left:640px;top:222px;width:320px;height:456px;z-index:5}
.mwand img{width:100%;height:100%;display:block}
.mwand .in{position:absolute;inset:0;filter:drop-shadow(0 0 14px rgba(255,214,120,.55)) drop-shadow(0 0 34px rgba(255,140,200,.35))}
.tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 35%,rgba(255,150,210,.28),transparent 60%),radial-gradient(ellipse at 75% 65%,rgba(120,200,255,.22),transparent 55%),rgba(255,240,200,.06)}
.wedge{position:absolute;left:0;top:0;width:80px;height:1200px;background:linear-gradient(90deg,transparent,rgba(255,240,200,.9) 45%,#fff 50%,rgba(255,200,230,.8) 55%,transparent);filter:blur(4px);mix-blend-mode:screen}
.flash{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,250,220,.9) 25%,rgba(255,220,150,.35) 50%,transparent 70%)}
.spark{position:absolute;border-radius:50%}
.star5{position:absolute;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)}

/* ---------- reading ---------- */
.big-q{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:82px;color:#fff;
  text-shadow:0 0 30px rgba(180,150,255,.7)}
.zframe{position:absolute;overflow:hidden;border-radius:18px;border:3px solid rgba(244,210,122,.75);
  box-shadow:0 0 0 8px rgba(244,210,122,.08),0 30px 70px rgba(0,0,0,.6),0 0 50px rgba(244,210,122,.25);background:#000}
.zimg{position:absolute;left:0;top:0;width:440px;height:660px;transform-origin:0 0}
.zov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rpanel{position:absolute}
.rhead{font-family:'Gowun Batang',serif;font-size:36px;color:var(--gold);margin-bottom:26px;min-height:46px}
.ritem{margin-bottom:22px;transform-origin:left center}
.ritem .lab{font-family:'Gowun Batang',serif;font-weight:700;font-size:48px;transition:font-size .5s,color .5s}
.ritem .mean{font-size:34px;color:var(--gold);margin-top:6px;opacity:0;transition:font-size .5s}
.ritem.dim .lab{font-size:30px;color:#cfc6f2}
.ritem.dim .mean{font-size:24px}
.ritem.dim{margin-bottom:14px}
.rkw{margin-top:22px;display:flex;gap:16px;align-items:center}
.rkw .k0{font-size:28px;color:var(--muted);margin-right:6px;opacity:0}
.chip{display:inline-block;padding:10px 30px;border-radius:40px;border:3px solid var(--gold);color:var(--gold);font-size:40px;
  font-family:'Gowun Batang',serif;font-weight:700;background:rgba(244,210,122,.1);opacity:0}
.ring{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid #fff;
  box-shadow:0 0 20px #fff,inset 0 0 20px rgba(255,255,255,.6)}
.rays{position:absolute;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,250,215,.75) 0deg 3deg,rgba(255,250,215,0) 3deg 12deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%);mix-blend-mode:screen}
.glare{position:absolute;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,rgba(255,248,210,.95) 18%,rgba(255,222,120,.45) 42%,transparent 70%);mix-blend-mode:screen}
.wavewrap{position:absolute;left:0;bottom:0;width:880px;height:320px}
.wavewrap svg{width:880px;height:320px;display:block}
.petal{position:absolute;width:16px;height:24px;border-radius:60% 60% 50% 50%/70% 70% 40% 40%;
  background:radial-gradient(ellipse at 40% 30%,#fff,#ffe6f0 60%,#f6c5d8)}
.pebble{position:absolute;background:#6e5434;border-radius:40% 55% 45% 60%}

/* ---------- numerology ---------- */
.n-title{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:70px;line-height:1.3;color:#fff;
  text-shadow:0 0 30px rgba(180,150,255,.7)}
.n-title .hl{color:var(--gold)}
.fan{position:absolute;left:0;top:0;width:1600px;height:900px}
.fcard{position:absolute;width:96px;height:144px;margin:-72px 0 0 -48px;border-radius:8px;background-size:100% 100%;
  box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 0 1px rgba(255,230,170,.35)}
.h2{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:60px;color:var(--gold);
  text-shadow:0 0 22px rgba(244,210,122,.45)}
.eqbox{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:20px;font-family:'Gowun Batang',serif;font-weight:700;
  font-size:46px;color:#fff;background:rgba(123,92,255,.22);border:3px solid rgba(160,140,255,.8);opacity:0}
.eqbox.op{border-radius:50%;background:var(--violet);border:none;font-family:'Gowun Dodum';font-size:44px;box-shadow:0 0 18px rgba(123,92,255,.8)}
.eqbox.gold{background:rgba(244,210,122,.14);border-color:var(--gold);color:var(--gold)}
.eqsub{position:absolute;text-align:center;font-size:32px;color:#e9e2ff;opacity:0}
.bul{position:absolute;display:flex;gap:22px;align-items:flex-start;font-size:34px;line-height:1.4;opacity:0}
.bul .ic{flex:0 0 46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f7dc8e,#e2a93c);color:#2a1a00;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-top:2px}
.bul b{color:var(--gold);font-weight:400}
.tcard{position:absolute;width:420px;height:300px;border-radius:24px;padding:34px 30px;background:linear-gradient(160deg,rgba(123,92,255,.28),rgba(30,20,80,.6));
  border:2px solid rgba(244,210,122,.55);box-shadow:0 18px 40px rgba(0,0,0,.4);opacity:0}
.tcard .no{font-family:'Gowun Batang',serif;font-size:56px;color:var(--gold);line-height:1}
.tcard .tx{font-size:32px;line-height:1.45;margin-top:18px}
.rule{position:absolute;display:flex;align-items:center;gap:30px;opacity:0}
.rule .no{flex:0 0 74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Gowun Batang',serif;
  font-weight:700;font-size:40px;color:#2a1a00;background:linear-gradient(135deg,#f7dc8e,#e2a93c);box-shadow:0 0 18px rgba(244,210,122,.5)}
.rule .tx{font-size:40px;width:760px}
.rule .tx b{color:var(--gold);font-weight:400}
.rule .ex{font-size:32px;padding:10px 26px;border-radius:14px;background:rgba(255,255,255,.08);border:2px dashed rgba(244,210,122,.6);color:#ffe9b0;white-space:nowrap}

.nbox{position:absolute;border:3px dashed rgba(244,210,122,.55);border-radius:18px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;
  font-family:'Gowun Batang',serif;font-weight:700;font-size:74px;color:#fff;opacity:0}
.nbox.full{border-style:solid;border-color:var(--gold);background:rgba(244,210,122,.12);box-shadow:0 0 22px rgba(244,210,122,.3)}
.nbox.res{border:4px solid var(--gold);color:var(--gold);font-size:84px;background:rgba(244,210,122,.08)}
.nbox.res.big{box-shadow:0 0 40px rgba(244,210,122,.8),inset 0 0 30px rgba(244,210,122,.3);background:rgba(244,210,122,.2)}
.pbox{position:absolute;border-radius:50%;background:var(--violet);color:#fff;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(123,92,255,.85);opacity:0}
.grp{position:absolute;text-align:center;font-size:28px;color:var(--gold);border-bottom:3px solid rgba(244,210,122,.6);padding-bottom:6px;opacity:0}
.fly{position:absolute;width:96px;height:116px;display:flex;align-items:center;justify-content:center;font-family:'Gowun Batang',serif;font-weight:700;
  font-size:74px;color:#fff;text-shadow:0 0 16px var(--gold)}
.badge{position:absolute;font-size:36px;padding:14px 32px;border-radius:50px;background:#ff5f8f;color:#fff;box-shadow:0 0 24px rgba(255,95,143,.6);opacity:0;white-space:nowrap}
.badge.ok{background:#3fbf8f;box-shadow:0 0 24px rgba(63,191,143,.6)}
.crack{position:absolute;width:12px;height:150px;margin-left:-6px;background:#fff;box-shadow:0 0 30px #fff,0 0 60px var(--gold);
  clip-path:polygon(50% 0,100% 18%,20% 38%,100% 58%,10% 80%,60% 100%,0 100%,70% 80%,0 58%,80% 38%,0 18%)}
.ans{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:58px;color:#fff;text-shadow:0 0 24px rgba(244,210,122,.6)}
.ans .g{color:var(--gold)}

/* ---------- emperor / lumi ---------- */
.emp{position:absolute;perspective:1400px}
.emp .cardface{position:absolute;inset:0;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 60px rgba(244,210,122,.35)}
.emp .cardface>img{width:100%;height:100%;display:block}
.lwrap{position:absolute;inset:0;opacity:0}
.lwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .18s}
.lband{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(#f3e7c8,#e8d6a8);color:#2b1d0a;font-family:'Gowun Batang',serif;font-weight:700;font-size:30px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;border-top:3px solid #3b2a10}
.lc{position:absolute;left:0;top:0;width:600px;height:900px;transform-origin:0 0;opacity:0}
.lc svg{position:absolute;left:0;top:0;width:600px;height:900px;overflow:visible}
.lfig{position:absolute;left:66px;top:66px;width:430px;height:638px}
.lfig img{position:absolute;inset:0;width:100%;height:100%}
.lfig .body{clip-path:polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,0% 21%,15% 20.5%,26% 22%,31% 26%,34% 30%,33% 34%,27% 35%,22% 34%,16% 39%,10% 46%,0% 46%)}
.lfig .arm{position:absolute;inset:0;transform-origin:31% 31%}
.lfig .arm img{clip-path:polygon(0% 21%,15% 20.5%,26% 22%,31% 26%,34% 30%,33% 34%,27% 35%,22% 34%,16% 39%,10% 46%,0% 46%)}
.lfig .arm svg,.lfig .deco{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.epanel{position:absolute}
.epanel .n{font-family:'Gowun Batang',serif;font-weight:700;font-size:96px;color:var(--gold);line-height:1;text-shadow:0 0 26px rgba(244,210,122,.6)}
.epanel .nm{font-family:'Gowun Batang',serif;font-weight:700;font-size:92px;line-height:1.2;margin-top:8px}
.epanel .ds{font-size:34px;color:#ffe3a3;margin-top:12px}
.epanel .who{font-size:26px;color:var(--muted);margin-top:30px;line-height:1.5}
.bubble{position:absolute;background:#fff;color:#3a2a6b;border-radius:44px;padding:36px 46px;font-family:'Jua',sans-serif;font-size:62px;line-height:1.22;
  box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 6px rgba(244,210,122,.6);opacity:0}
.bubble::before{content:'';position:absolute;left:-38px;top:120px;border:22px solid transparent;border-right:30px solid #fff}
.mini-bub{position:absolute;background:#fff;color:#7b3ad6;border-radius:30px;padding:10px 26px;font-family:'Jua';font-size:40px;opacity:0;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.calc-ui{position:absolute;display:flex;gap:12px;align-items:center;opacity:0;cursor:default}
.calc-ui .lbl{font-size:22px;color:var(--muted);position:absolute;top:-34px;left:4px;white-space:nowrap}
.calc-ui input{width:300px;height:62px;border-radius:16px;border:2px solid rgba(244,210,122,.7);background:rgba(10,8,40,.7);color:#fff;font-size:30px;
  padding:0 20px;font-family:'Gowun Dodum';letter-spacing:.08em;outline:none}
.calc-ui input:focus{box-shadow:0 0 0 4px rgba(244,210,122,.3)}
.calc-ui button{height:62px;padding:0 30px;border-radius:16px;border:none;background:linear-gradient(135deg,#f7dc8e,#e2a93c);color:#2a1a00;font-size:30px;
  font-family:'Jua';cursor:pointer}
.ovl{position:absolute;inset:0;z-index:70;background:rgba(5,4,26,.94);cursor:default}
.ovl .x{position:absolute;right:30px;top:20px;font-size:48px;color:#fff;cursor:pointer;opacity:.7;z-index:3}
.ovl .x:hover{opacity:1}

/* ---------- ending ---------- */
.ringwrap{position:absolute;left:800px;top:420px;width:0;height:0}
.rcard{position:absolute;width:66px;height:99px;margin:-49.5px 0 0 -33px;border-radius:6px;background-size:100% 100%;box-shadow:0 0 12px rgba(0,0,0,.5),0 0 0 1px rgba(255,230,170,.3)}
.rcard.glow{box-shadow:0 0 26px var(--gold),0 0 0 3px var(--gold)}
.c-text{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;color:#fff}
.logo{position:absolute;text-align:center;font-family:'Gowun Batang',serif;font-weight:700;font-size:120px;letter-spacing:.08em;
  background:linear-gradient(100deg,#c8902a 0%,#fff1c2 30%,#f4d27a 45%,#fff8de 55%,#c8902a 80%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(244,210,122,.5));opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" width="1600" height="900"></canvas>

/* ===================================================================

function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}

['황제','권력·책임','The Emperor'],['교황','가르침','The Hierophant'],['연인','관계·사랑','The Lovers'],['전차','전진','The Chariot'],
['힘','인내','Strength'],['은둔자','성찰','The Hermit'],['운명의 수레바퀴','운명·변화','Wheel of Fortune'],['정의','균형','Justice'],
['매달린 남자','정체·희생','The Hanged Man'],['죽음','끝과 새 출발','Death'],['절제','조화','Temperance'],['악마','집착','The Devil'],
['탑','급변','The Tower'],['별','희망','The Star'],['달','불안·비밀','The Moon'],['태양','활기·행복','The Sun'],['심판','부활·소식','Judgement'],['세계','완성','The World']];
const ROMAN=['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const ACTS=[[0,7,'1막 · 세상으로 나가다'],[8,14,'2막 · 나를 돌아보다'],[15,21,'3막 · 어둠을 지나 빛으로']];
const actOf=n=>ACTS.findIndex(a=>n>=a[0]&&n<=a[1]);
for(let i=0;i<22;i++){const im=new Image();im.src=IMG(i);}
['lumi-point','lumi-happy'].forEach(n=>{const im=new Image();im.src=`img/${n}.webp`;});

/* ---------- async helpers (cancel on scene jump) ---------- */
let GEN=0;
class Cancel extends Error{}
const wait=ms=>{const g=GEN;return new Promise((res,rej)=>setTimeout(()=>g===GEN?res():rej(new Cancel()),ms));};
function A(el,kf,opt){
  const g=GEN;const o=typeof opt==='number'?{duration:opt}:Object.assign({},opt);
  const a=el.animate(kf,Object.assign({fill:'both',easing:'cubic-bezier(.2,.8,.2,1)'},o));
  return a.finished.then(()=>{try{a.commitStyles();a.cancel();}catch(e){} if(g!==GEN)throw new Cancel();},()=>{throw new Cancel();});
}
function loop(el,kf,opt){return el.animate(kf,Object.assign({iterations:Infinity,easing:'ease-in-out'},opt));}
function every(ms,fn){const g=GEN;const id=setInterval(()=>{if(g!==GEN)return clearInterval(id);fn();},ms);return id;}
function E(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;}
function place(e,x,y,w,h){e.style.left=x+'px';e.style.top=y+'px';if(w!=null)e.style.width=w+'px';if(h!=null)e.style.height=h+'px';return e;}
const rnd=(a,b)=>a+Math.random()*(b-a);
function shake(el,dur=500,amp=8){const k=[];for(let i=0;i<10;i++)k.push({transform:`translate(${rnd(-amp,amp)}px,${rnd(-amp,amp)}px)`});k.push({transform:'translate(0,0)'});
  return el.animate(k,{duration:dur,composite:'add'});}

/* ---------- typing ---------- */
async function typeText(el,text,speed=75,opts={}){
  el.innerHTML='';
  for(const c of text){
    if(c==='\n'){E('br','',el);continue;}
    const s=E('span','ch'+(opts.cls?' '+opts.cls:''),el);s.textContent=c;
    s.animate([{opacity:0,transform:'translateY(34px) scale(.3) rotate(-14deg)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],
      {duration:460,easing:'cubic-bezier(.2,1.7,.4,1)',fill:'both'});
    if(c!==' '&&!opts.quiet)SFX.type();
    await wait(c===' '?speed*.6:speed);
  }
}

/* ---------- particles ---------- */
const SPC=['#fff4c2','#ffffff','#ffc6e0','#bfe8ff','#f4d27a'];
function burst(parent,x,y,n=18,o={}){
  const spread=o.spread||170,dur=o.dur||900,grav=o.grav||0,cols=o.colors||SPC,sz=o.size||[5,14];
  for(let i=0;i<n;i++){
    const star=Math.random()<.5;const p=E('div',star?'star5':'spark',parent);const s=rnd(sz[0],sz[1])*(star?1.8:1);
    p.style.width=p.style.height=s+'px';p.style.left=(x-s/2)+'px';p.style.top=(y-s/2)+'px';
    const c=cols[i%cols.length];p.style.background=star?c:`radial-gradient(circle,#fff 0%,${c} 40%,transparent 72%)`;
    const a=Math.random()*Math.PI*2,d=rnd(spread*.3,spread);const dx=Math.cos(a)*d,dy=Math.sin(a)*d;
    p.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy+grav}px) scale(0) rotate(${rnd(-200,200)}deg)`,opacity:0}],
      {duration:dur*rnd(.6,1.2),easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>p.remove();
  }
}
function flashAt(parent,x,y,size=600,dur=700){const f=E('div','flash',parent);place(f,x-size/2,y-size/2,size,size);
  f.animate([{transform:'scale(.1)',opacity:1},{transform:'scale(1.3)',opacity:0}],{duration:dur,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>f.remove();}
function screenFlash(color='#fff',peak=.8,dur=600){const f=E('div','',fx);f.style.cssText=`position:absolute;inset:0;background:${color}`;
  f.animate([{opacity:peak},{opacity:0}],{duration:dur}).onfinish=()=>f.remove();}

/* ---------- sound (Web Audio, synthesized) ---------- */
let AC=null,MASTER=null,muted=false,NB=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,dur,type='sine',vol=.2,glide,att=.008){const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t0+dur);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+att);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(MASTER);o.start(t0);o.stop(t0+dur+.05);}
function noise(t0,dur,o={}){const a=ac();const s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type=o.type||'lowpass';
  f.frequency.setValueAtTime(o.f||1000,t0);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+(o.fT||dur));f.Q.value=o.q||1;
  const g=a.createGain();const v=o.vol||.3,att=o.att||.02;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+att);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t0);s.stop(t0+dur+.05);}
const PENTA=[0,2,4,7,9];
const ok=()=>AC&&AC.state==='running'&&!muted;
const SFX={
  type(){if(!ok())return;const t=ac().currentTime;tone(rnd(1800,2400),t,.03,'triangle',.018);},
  chime(){ /* 촤르르르 — 요술지팡이 */
    if(!ok())return;const t=ac().currentTime;
    for(let i=0;i<22;i++){const st=PENTA[i%5]+12*Math.floor(i/5);const f=523*Math.pow(2,st/12);tone(f,t+i*.038,.7,'sine',.07);tone(f*2.01,t+i*.038,.3,'triangle',.018);}
    for(let i=0;i<14;i++){const f=rnd(2500,6000);tone(f,t+.75+i*.05,.35,'sine',.035);}
    noise(t,1.6,{type:'highpass',f:5000,vol:.07,att:.4});},
  sparkle(){if(!ok())return;const t=ac().currentTime;for(let i=0;i<7;i++)tone(rnd(1800,4200),t+i*.05,.4,'sine',.05);},
  unfreeze(){if(!ok())return;const t=ac().currentTime;noise(t,.9,{type:'bandpass',f:400,f2:5000,q:2,vol:.18,att:.5});
    [523,659,784,1046].forEach((f,i)=>tone(f,t+.3+i*.07,1.2,'sine',.06,null,.1));},
  whoosh(){if(!ok())return;const t=ac().currentTime;noise(t,.55,{type:'bandpass',f:300,f2:2600,q:1.2,vol:.25,att:.2});},
  tick(n){if(!ok())return;const t=ac().currentTime;const f=392*Math.pow(2,(PENTA[n%5]+12*Math.floor(n/5))/12);tone(f,t,.35,'triangle',.07);tone(f*2,t,.18,'sine',.03);},
  step(){if(!ok())return;const t=ac().currentTime;tone(160,t,.08,'sine',.12,90);},
  rumble(){if(!ok())return;const t=ac().currentTime;noise(t,1.1,{type:'lowpass',f:140,vol:.6,att:.05});for(let i=0;i<6;i++)tone(rnd(300,700),t+.15+i*.12,.06,'square',.03,rnd(150,250));},
  sun(){if(!ok())return;const t=ac().currentTime;noise(t,1.3,{type:'bandpass',f:600,f2:7000,q:.8,vol:.2,att:.6,fT:.7});
    [523,659,784,1046,1318].forEach((f,i)=>tone(f,t+.5,1.8,'sine',.07,null,.25));this.sparkle();},
  wave(){if(!ok())return;const t=ac().currentTime;noise(t,2.6,{type:'lowpass',f:300,f2:2400,vol:.55,att:.55,fT:.6});
    noise(t+.45,2.0,{type:'highpass',f:3000,vol:.16,att:.15});noise(t+.5,1.2,{type:'lowpass',f:120,vol:.5,att:.03});},
  pop(i=0){if(!ok())return;const t=ac().currentTime;tone(420+i*70,t,.16,'sine',.25,(420+i*70)*1.8);},
  thud(){if(!ok())return;const t=ac().currentTime;tone(150,t,.35,'sine',.6,45);noise(t,.18,{type:'lowpass',f:500,vol:.4,att:.005});},
  crack(){if(!ok())return;const t=ac().currentTime;noise(t,.35,{type:'highpass',f:1500,vol:.5,att:.003});tone(900,t,.12,'square',.06,200);},
  poof(){if(!ok())return;const t=ac().currentTime;noise(t,.8,{type:'bandpass',f:2500,f2:300,q:1,vol:.35,att:.03});setTimeout(()=>this.sparkle(),250);},
  boing(){if(!ok())return;const t=ac().currentTime;tone(520,t,.22,'sine',.18,980);tone(660,t+.24,.25,'sine',.16,1200);},
  ta(){if(!ok())return;const t=ac().currentTime;[523,659,784].forEach(f=>tone(f,t,.18,'triangle',.1));[523,659,784,1046].forEach(f=>tone(f,t+.2,1.1,'triangle',.09));}
};

/* ---------- starry sky ---------- */
(function(){const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
 const st=Array.from({length:240},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6.28,s:.4+Math.random()*2}));
 let sh=null;
 function draw(t){ctx.clearRect(0,0,W,H);
  for(const s of st){ctx.globalAlpha=.25+.75*Math.abs(Math.sin(s.p+t*.0008*s.s));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  if(!sh&&Math.random()<.003)sh={x:rnd(300,1500),y:rnd(0,250),l:0};
  if(sh){sh.l+=16;const x=sh.x-sh.l,y=sh.y+sh.l*.45;const g=ctx.createLinearGradient(x,y,x+150,y-68);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+150,y-68);ctx.stroke();if(sh.l>700)sh=null;}
  requestAnimationFrame(draw);}
 requestAnimationFrame(draw);})();

/* ---------- reusable pieces ---------- */
function card(parent,n,x,y,w){const c=E('div','card',parent);place(c,x,y,w,w*1.5);c.img=E('img','',c);c.img.src=IMG(n);c.img.draggable=false;
  c.nx=E('img','nx',c);c.nx.draggable=false;return c;}
/* 영상 클립: 있으면 자동 사용 */
async function findClips(single,seq){if(await hasVideo(single[0]))return single;const out=[];for(const u of seq){if(await hasVideo(u))out.push(u);else break;}return out;}
async function playClips(parent,urls){let last=null;
  for(const u of urls){const v=E('video','cardvid',parent);v.src=u;v.muted=true;v.playsInline=true;v.preload='auto';
    await new Promise(r=>{v.oncanplay=r;v.load();});await v.play().catch(()=>{});
    if(last)last.remove();last=v;await new Promise(r=>{v.onended=r;});}
  return last;}
function hasImg(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(true);i.onerror=()=>r(false);setTimeout(()=>r(false),2500);i.src=u;});}
function hasVideo(u){return new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(true);v.onerror=()=>r(false);setTimeout(()=>r(false),2500);v.src=u;});}
function traveler(parent,n,x,y,w){const t=E('div','trav',parent);place(t,x,y,w,w*1.5);t.bob=E('div','bob',t);t.cut=E('div','cut mask-fig',t.bob);
  t.cut.style.backgroundImage=`url(${IMG(n)})`;return t;}
function walkBob(t){return loop(t.bob,[{transform:'translateY(0) rotate(-2.5deg)'},{transform:'translateY(-16px) rotate(0)'},{transform:'translateY(0) rotate(2.5deg)'},
  {transform:'translateY(-16px) rotate(0)'},{transform:'translateY(0) rotate(-2.5deg)'}],{duration:760,easing:'linear'});}

function starPath(cx,cy,R,r){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1);}return d+'Z';}

let MW=null;
function makeWand(){if(MW)MW.remove();MW=E('div','mwand',fx);MW.in=E('div','in',MW,'<img src="img/wand.png" draggable="false">');return MW;}
function wandIdle(){MW.float=loop(MW.in,[{transform:'translateY(0) rotate(-4deg)'},{transform:'translateY(-18px) rotate(4deg)'},{transform:'translateY(0) rotate(-4deg)'}],{duration:2600});
  MW.em=every(160,()=>burst(fx,838+rnd(-50,50),320+rnd(-50,50),2,{spread:70,dur:900,grav:60}));}

/* ---------- scene engine ---------- */
let cur=0,stepIdx=0,busy=false,curLayer=null,RUN=0;
function setHint(on){hintEl.classList.toggle('on',on);}
async function run(fn){const my=++RUN;busy=true;setHint(false);
  try{await fn();}catch(e){if(!(e instanceof Cancel))console.error(e);}
  if(my===RUN){busy=false;setHint(true);}}
function newLayer(){const L=document.createElement('div');L.className='layer';stage.insertBefore(L,fx);return L;}
function updateNav(){[...navEl.children].forEach((d,i)=>d.classList.toggle('on',i===cur));}
async function enter(i){cur=i;stepIdx=1;updateNav();await SC[i].steps[0]();}
function goScene(i){if(i<0||i>=SC.length)return;GEN++;fx.innerHTML='';MW=null;stage.querySelectorAll('.layer,.ovl').forEach(l=>l.remove());
  curLayer=newLayer();SC[i].setup(curLayer);run(()=>enter(i));}
function next(){if(busy)return;const sc=SC[cur];
  if(stepIdx<sc.steps.length){const f=sc.steps[stepIdx++];run(f);}
  else if(cur<SC.length-1)run(()=>fadeTo(cur+1));}

async function fadeTo(i){const old=curLayer;const L=newLayer();SC[i].setup(L);curLayer=L;
  burst(fx,800,450,40,{spread:600,dur:1200});SFX.whoosh();
  A(old,[{opacity:1,transform:'scale(1)',filter:'blur(0)'},{opacity:0,transform:'scale(1.08)',filter:'blur(10px)'}],800).then(()=>old.remove()).catch(()=>{});
  await A(L,[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'scale(1)'}],800);L.style.transform='';
  await enter(i);}

/* 요술지팡이 와이프 전환 */
async function wandSweep(i){
  const g=GEN;let x0=-260;
  if(MW){MW.getAnimations().forEach(a=>a.cancel());MW.in.getAnimations().forEach(a=>a.cancel());clearInterval(MW.em);
    await A(MW,[{transform:'translate(0,0) rotate(0)'},{transform:'translate(-640px,40px) rotate(-35deg)'}],{duration:450,easing:'cubic-bezier(.5,0,.7,.4)'});x0=160;}
  else makeWand();
  SFX.chime();
  const old=curLayer;const L=newLayer();SC[i].setup(L);curLayer=L;L.style.clipPath='polygon(0 0,0 0,0 100%,0 100%)';
  const tint=E('div','tint',L);L.prepend(tint);const edge=E('div','wedge',fx);

/* 직접 입력 계산 (오버레이) */
async function customCalc(ds){
  const y=+ds.slice(0,4),m=+ds.slice(4,6),d=+ds.slice(6,8);
  const ov=E('div','ovl',stage);['click','pointerdown'].forEach(ev=>ov.addEventListener(ev,e=>e.stopPropagation()));
  const x=E('div','x',ov,'×');x.addEventListener('click',()=>{ov.remove();});
  const h=E('div','h2',ov);place(h,0,70,1600);h.style.fontSize='54px';
  const C=E('div','layer',ov);const c=new Calc(C,ds,250);
  try{
    await typeText(h,`${y}년 ${m}월 ${d}일생`,70);
    await c.intro();let r=await c.phase1();
    if(r===null){await wait(700);r=await c.phase2();}
    await wait(400);
    const cd=card(ov,r,c.y2?1150:1210,c.y2?390:440,c.y2?220:200);
    await A(cd,[{opacity:0,transform:'perspective(1000px) rotateY(180deg) scale(.5)'},{opacity:1,transform:'none'}],{duration:800,easing:'cubic-bezier(.3,1.4,.5,1)'});
    SFX.ta();burst(fx,cd.offsetLeft+cd.offsetWidth/2,cd.offsetTop+cd.offsetHeight/2,40,{spread:260});
    const an=E('div','ans',ov);place(an,0,c.y2?760:700,c.y2?1600:1150);
    an.innerHTML=`인생카드는 <span class="g">${r}번 · ${MAJ[r][0]}</span> <span style="font-size:36px;color:#b9addf">— ${MAJ[r][1]}</span>`;
    await A(an,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],600);
  }catch(e){if(!(e instanceof Cancel))console.error(e);}
}

  b.addEventListener('click',()=>{ac();b.blur();backToCards();});
  setInterval(()=>b.classList.toggle('on',canBack()),250);})();
SC.forEach(()=>E('i','',navEl));

/* ---------- input ---------- */
stage.addEventListener('click',()=>{ac();next();});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){stage.querySelectorAll('.ovl').forEach(o=>o.remove());if(document.activeElement)document.activeElement.blur();return;}
  if(e.target.tagName==='INPUT')return;
  if([' ','ArrowRight','Enter','PageDown'].includes(e.key)){e.preventDefault();ac();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ac();goScene(stepIdx>1?cur:cur-1);}
  else if(/^[1-7]$/.test(e.key)){ac();goScene(+e.key-1);}
  else if(e.key==='m'||e.key==='M'){muted=!muted;if(MASTER)MASTER.gain.value=muted?0:.8;}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key==='Escape'){stage.querySelectorAll('.ovl').forEach(o=>o.remove());}
});
document.fonts&&document.fonts.ready.then(()=>{});
goScene(0);
</script>
</body>
