      <tbody>${rows}</tbody></table></div>
    <div class="muted small" style="margin-top:8px">새로 등록할 사람에게 이 페이지 주소를 알려주고 구글 로그인을 한 번 하게 하면 목록에 나타나요.</div>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-role]');
  if (!b || b.disabled) return;
  if (b.tagName === 'INPUT') return; // 체크박스는 change에서 처리
  await setRole(b.dataset.uid, b.dataset.role, b.dataset.on === '1');
});
document.addEventListener('change', async e => {
  const b = e.target.closest('input[data-role]');
  if (b) await setRole(b.dataset.uid, b.dataset.role, b.checked);
  const kl = e.target.closest('input[data-kakao-link]');
  if (kl && await saveKakaoLink(kl.dataset.kakaoLink, kl.value)) render();
  const un = e.target.closest('input[data-user-name], input[data-user-phone]');
  if (un) await saveUserInfo(un);
  const ins = e.target.closest('input[data-instructor]');
  if (ins) {
    const u = S.users.find(x => x.uid === ins.dataset.instructor);
    const instructor = ins.value.trim().slice(0, 20);
    try {
      await updateDoc(doc(db, 'users', u.uid), {instructor, instructorUpdatedAt: serverTimestamp()});
      u.instructor = instructor;
      toast(`${u.name}: 담당교관 ${instructor || '비움'}`);
    } catch (err) { toast('저장 실패: ' + (err.code || err.message)); }
  }
});

// 관리자가 가입자 이름·전화번호를 고친다
async function saveUserInfo(el) {
  const isName = 'userName' in el.dataset, uid = isName ? el.dataset.userName : el.dataset.userPhone;
  const u = S.users.find(x => x.uid === uid);
  const k = isName ? 'name' : 'phone';
  const v = isName ? el.value.trim() : el.value.replace(/[^0-9]/g, '');
  const reset = () => { el.value = isName ? u.name : fmtPhone(u.phone); };
  if (isName ? !v : v && !PHONE_RE.test(v)) { toast(isName ? '이름을 비울 수 없어요' : '전화번호를 확인해주세요'); reset(); return; }
  if ((u[k] || '') === v) { reset(); return; }
  try {
    await updateDoc(doc(db, 'users', uid), {[k]: v});
    u[k] = v;
    if (uid === S.me.uid) S.me[k] = v;
    if (isName) await syncStaffNames();
    toast(`${u.name}: ${isName ? '이름' : '전화번호'} 저장`);
    render();
  } catch (err) {
    toast('저장 실패: ' + (err.code || err.message));
    reset();
  }
}

async function setRole(uid, role, on) {
  const u = S.users.find(x => x.uid === uid);
  const labels = {admin: '관리자', leader: '리더', caller: '콜러', seminarStaff: '세미나 스태프', marketing: '마케팅'};
  if (!on && (role === 'leader' || role === 'caller')) {
    const k = role === 'leader' ? 'leaderUid' : 'callerUid';
    const n = [...S.customers.values()].filter(c => c[k] === uid).length;
    if (n && !confirm(`${u.name}님에게 배정된 고객 ${n}명이 있어요. ${labels[role]} 등록을 해제해도 배정은 그대로 남아요. 계속할까요?`)) { render(); return; }
  }
  const roles = {...(u.roles || {}), [role]: on};
  try {
    await updateDoc(doc(db, 'users', uid), {roles, rolesUpdatedAt: serverTimestamp()});
    u.roles = roles;
    toast(`${u.name}: ${labels[role]} ${on ? '등록' : '해제'}`);
    if (on) await ogPlaceForRole(uid, role);
  } catch (err) {
    toast('변경 실패: ' + (err.code || err.message));
  }
  render();
}

/* ═══════════════════════════════════════
   인스타그램 댓글 자동응답
   ig_config/settings 에 저장 → 웹훅(api/ig-webhook)이 1분 안에 읽어 간다.
   판별 로직(lib/ig/rules.js)은 서버와 같은 파일을 import 해서 "댓글 테스트"에 쓴다.
═══════════════════════════════════════ */
const IG = {lib: null, settings: null, log: [], loading: false, dirty: false, testPost: '', testText: ''};

async function loadInstagram() {
  if (IG.loading) return;
  IG.loading = true;
  try {
    const [rules, config, snap, logs] = await Promise.all([
      import('/lib/ig/rules.js'), import('/lib/ig/config.js'),
      getDoc(doc(db, 'ig_config', 'settings')),
      getDocs(query(collection(db, 'ig_comments'), orderBy('createdAt', 'desc'), limit(30))),
    ]);
    IG.lib = {...rules, ...config};
    IG.settings = {...structuredClone(config.DEFAULT_SETTINGS), ...(snap.exists() ? snap.data() : {})};
    IG.settings.rules = (IG.settings.rules || []).map(r => ({...r}));
    IG.log = logs.docs.map(d => ({id: d.id, ...d.data()}));
    IG.dirty = false;
  } catch (e) {
    toast('인스타그램 설정을 불러오지 못했어요: ' + (e.code || e.message));
  }
  IG.loading = false;
  if (S.tab === 'instagram' && IG.settings) render();
}

const igId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 8);

function renderInstagram() {
  if (!IG.settings) { loadInstagram(); return '<div class="empty">불러오는 중…</div>'; }
  const st = IG.settings;
  const rules = st.rules.map((r, i) => `
    <div class="panel ig-rule ${r.enabled === false ? 'off' : ''}" data-ig-rule="${i}">
      <div class="head">
        <label class="role-toggle"><input type="checkbox" data-ig="enabled" ${r.enabled !== false ? 'checked' : ''}> 켜기</label>
        <input class="inp" data-ig="name" maxlength="30" placeholder="규칙 이름 (메모용)" value="${esc(r.name)}">
        <span class="badge ${r.post ? 'b-stage' : 'b-muted'}">${r.post ? '특정 게시물' : '모든 게시물'}</span>
        <button class="btn sm danger" data-ig-del="${i}">삭제</button>
      </div>
      <div class="ig-grid">
        <div class="field"><label>반응할 키워드 (쉼표로 구분)</label>
          <input class="inp" data-ig="keywords" placeholder="예: 루미, 타로, 상담  /  번호 게시물은 1번" value="${esc((r.keywords || []).join(', '))}">
          <div class="hint">"1번"처럼 쓰면 1, 1️⃣, 첫번째 댓글도 잡아요</div></div>
        <div class="field"><label>적용 게시물 (비우면 모든 게시물)</label>
          <input class="inp" data-ig="post" placeholder="게시물 주소를 붙여넣기" value="${esc(r.post)}">
          <div class="hint">특정 게시물 규칙이 모든 게시물 규칙보다 먼저 적용돼요</div></div>
      </div>
      <div class="field"><label>댓글에 달 답글 (한 줄에 하나 · 여러 줄이면 무작위로 하나)</label>
        <textarea data-ig="replies" style="min-height:70px" placeholder="비우면 공개 답글 없이 DM만 보내요">${esc((r.replies || []).join('\n'))}</textarea></div>
      <div class="field"><label>보낼 DM</label>
        <textarea data-ig="dm" placeholder="이 키워드에 보낼 메시지 (예: 1번 카드 리딩)">${esc(r.dm)}</textarea>
        <label class="role-toggle" style="margin-top:6px"><input type="checkbox" data-ig="appendPromo" ${r.appendPromo ? 'checked' : ''}> DM 끝에 공통 홍보 문구 붙이기</label>
        <div class="hint" data-ig-len="${i}">${igLenLabel(r)}</div></div>
    </div>`).join('');

  const res = (x, label) => !x || x.skipped ? '' : x.ok
    ? `<span class="badge b-done">${label}</span>`
    : `<span class="badge b-bad">${label} 실패</span>`;
  const logRows = IG.log.map(l => `<tr>
      <td class="muted">${fmt(l.createdAt)}</td><td>${esc(l.username || l.fromId)}</td>
      <td class="wrap">${esc(l.text)}</td><td>${esc(l.rule || '')} <span class="muted small">${esc(l.keyword || '')}</span></td>
      <td>${l.status === 'processing' ? '<span class="badge b-before">처리 중</span>' : res(l.reply, '답글') + ' ' + res(l.dm, l.gate ? '안내 DM' : 'DM')}
        ${l.status === 'waiting' ? `<span class="badge b-before">팔로우 대기${l.notFollowingCount ? ` · 미팔로우 ${l.notFollowingCount}회` : ''}</span>` : ''}
        ${l.delivered ? res(l.delivered, '리딩 전달') : ''}
        ${[l.reply, l.dm, l.delivered].filter(x => x && x.error).map(x => `<div class="small" style="color:var(--bad)">${esc(x.error)}</div>`).join('')}</td>
    </tr>`).join('');

  return `
    <div class="page-title">인스타그램 자동응답 <span class="sub">키워드가 담긴 댓글에 답글을 달고 DM 1통을 보내요 · 저장하면 1분 안에 적용</span></div>

    <div class="panel">
      <h3>댓글 테스트 <span class="muted small" style="font-weight:400">저장 전 내용으로 미리 확인</span></h3>
      <div class="ig-grid">
        <div class="field"><label>댓글</label><input class="inp" id="ig-test-text" placeholder="예: 2번이요!" value="${esc(IG.testText)}"></div>
        <div class="field"><label>게시물 주소 (선택)</label><input class="inp" id="ig-test-post" placeholder="특정 게시물 규칙을 볼 때" value="${esc(IG.testPost)}"></div>
      </div>
      <div id="ig-test-out">${igTestResult()}</div>
    </div>

    <div class="panel">
      <h3>공통 홍보 문구</h3>
      <textarea id="ig-promo" style="min-height:220px">${esc(st.promo)}</textarea>
      <div class="hint">{리딩링크} {세미나링크} 가 든 줄은 팔로우 확인을 켜면 빠지고 아래 버튼으로 대신 가요. 끄면 짧은 주소로 바뀌어요</div>
    </div>

    <div class="panel">
      <h3>팔로우 확인 · 링크 버튼</h3>
      <label class="role-toggle"><input type="checkbox" data-ig-set="followGate" ${st.followGate !== false ? 'checked' : ''}> 팔로우한 사람에게만 리딩 보내기</label>
      <div class="hint" style="margin-bottom:10px">켜면: 댓글 → 아래 "첫 DM" → 고객이 '팔로우했어요'를 누르거나 답장 → 팔로우 확인 → 리딩 + 링크 버튼. 인스타그램 정책상 고객이 한 번 답장해야 팔로우를 확인할 수 있어요.</div>
      <div class="ig-grid">
        <div class="field"><label>첫 DM (팔로우 안내)</label><textarea data-ig-set="gateText" style="min-height:120px">${esc(st.gateText)}</textarea></div>
        <div class="field"><label>팔로우가 안 되어 있을 때</label><textarea data-ig-set="notFollowingText" style="min-height:120px">${esc(st.notFollowingText)}</textarea></div>
      </div>
      <div class="ig-grid">
        <div class="field"><label>버튼 위 안내 문구</label><input class="inp" data-ig-set="buttonText" maxlength="100" value="${esc(st.buttonText)}"></div>
        <div class="field"><label>리딩 버튼 글자 (20자, 비우면 버튼 없음)</label><input class="inp" data-ig-set="readingButton" maxlength="20" value="${esc(st.readingButton)}"></div>
        <div class="field"><label>세미나 버튼 글자 (20자, 비우면 버튼 없음)</label><input class="inp" data-ig-set="seminarButton" maxlength="20" value="${esc(st.seminarButton)}"></div>
      </div>
    </div>

    ${rules || '<div class="empty">규칙이 없어요. 아래에서 추가하세요.</div>'}

    <div class="btn-row" style="justify-content:space-between;margin-bottom:24px">
      <div class="btn-row">
        <button class="btn" data-ig-add="keyword">+ 키워드 규칙</button>
        <button class="btn" data-ig-add="pick">+ 번호 게시물 (1·2·3번)</button>
      </div>
      <div class="btn-row">
        ${IG.dirty ? '<span class="small" style="color:var(--warn)">저장하지 않은 변경이 있어요</span>' : ''}
        <button class="btn" data-ig-reload>되돌리기</button>
        <button class="btn primary" data-ig-save>저장 (바로 적용)</button>
      </div>
    </div>

    <div class="page-title">최근 처리 기록 <span class="sub">최신 30건 · 90일 뒤 자동 삭제</span></div>
    ${logRows ? `<div class="table-wrap"><table><thead><tr><th>일시</th><th>계정</th><th>댓글</th><th>규칙</th><th>결과</th></tr></thead><tbody>${logRows}</tbody></table></div>`
      : '<div class="empty">아직 처리한 댓글이 없어요</div>'}`;
}

function igLenLabel(r) {
  const L = IG.lib, gate = IG.settings.followGate !== false, n = L.composeDm(r, IG.settings.promo, gate).length;
  if (!n) return '<b style="color:var(--bad)">DM 내용이 비어 있어요 — DM을 보내지 않아요</b>';
  const raw = (gate ? r.dm.length : L.fillLinks(r.dm).trim().length) + (r.appendPromo ? (gate ? IG.settings.promo.length : L.fillLinks(IG.settings.promo).trim().length) + 16 : 0);
  return `DM 길이 ${n} / ${L.DM_LIMIT}자` + (raw > L.DM_LIMIT ? ' <b style="color:var(--bad)">— 너무 길어서 DM 문구 끝이 잘려요</b>' : '');
}

function igTestResult() {
  if (!IG.testText.trim()) return '<div class="hint">댓글을 입력하면 어떤 답글과 DM이 나가는지 보여드려요</div>';
  const a = IG.lib.decide(IG.testText, IG.settings, IG.lib.toShortcode(IG.testPost) || null);
  if (!a) return '<div class="notice">반응하지 않아요 (맞는 키워드가 없어요)</div>';
  const st = IG.settings, head = `<div class="small"><b>${esc(a.rule.name || '이름 없는 규칙')}</b> · 키워드 "${esc(a.keyword)}"</div>
    <div class="hint" style="margin-top:8px">공개 답글</div><div class="ig-preview">${esc(a.reply) || '(답글 없음)'}</div>`;
  if (st.followGate === false) return head + `<div class="hint" style="margin-top:8px">DM (${a.dm.length}자)</div><div class="ig-preview">${esc(a.dm) || '(DM 없음)'}</div>`;
  const btns = a.buttons.map(b => `<span class="badge b-stage" style="margin:6px 6px 0 0">${esc(b.title)}</span>`).join('');
  return head + `
    <div class="hint" style="margin-top:8px">① 댓글 직후 DM <span class="badge b-muted">${esc(IG.lib.FOLLOW_BUTTON)}</span> 버튼과 함께</div><div class="ig-preview">${esc(st.gateText)}</div>
    <div class="hint" style="margin-top:8px">② 팔로우가 확인되면 (${a.content.length}자)</div><div class="ig-preview">${esc(a.content) || '(본문 없음)'}</div>
    ${btns ? `<div class="ig-preview">${esc(st.buttonText)}<div>${btns}</div></div>` : ''}
    <div class="hint" style="margin-top:8px">②' 아직 팔로우하지 않았으면</div><div class="ig-preview">${esc(st.notFollowingText)}</div>`;
}

function igRefreshLive() {
  document.querySelectorAll('[data-ig-len]').forEach(el => { el.innerHTML = igLenLabel(IG.settings.rules[+el.dataset.igLen]); });
  const out = $('#ig-test-out'); if (out) out.innerHTML = igTestResult();
}

document.addEventListener('input', e => {
  if (S.tab !== 'instagram' || !IG.settings) return;
  const t = e.target;
  if (t.id === 'ig-test-text') { IG.testText = t.value; igRefreshLive(); return; }
  if (t.id === 'ig-test-post') { IG.testPost = t.value; igRefreshLive(); return; }
  if (t.id === 'ig-promo') { IG.settings.promo = t.value; IG.dirty = true; igRefreshLive(); return; }
  if (t.dataset.igSet && t.type !== 'checkbox') { IG.settings[t.dataset.igSet] = t.value; IG.dirty = true; igRefreshLive(); return; }
  const box = t.closest('[data-ig-rule]'), f = t.dataset.ig;
  if (!box || !f || t.type === 'checkbox') return;
  const r = IG.settings.rules[+box.dataset.igRule];
  if (f === 'keywords') r.keywords = t.value.split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
  else if (f === 'replies') r.replies = t.value.split('\n');
  else r[f] = t.value;
  IG.dirty = true;
  igRefreshLive();
});
document.addEventListener('change', e => {
  if (S.tab !== 'instagram' || !IG.settings) return;
  const t = e.target, box = t.closest('[data-ig-rule]');
  if (t.dataset.igSet && t.type === 'checkbox') { IG.settings[t.dataset.igSet] = t.checked; IG.dirty = true; igRefreshLive(); return; }
  if (!box || t.type !== 'checkbox') return;
  IG.settings.rules[+box.dataset.igRule][t.dataset.ig] = t.checked;
  IG.dirty = true;
  if (t.dataset.ig === 'enabled') box.classList.toggle('off', !t.checked);
  igRefreshLive();
});
document.addEventListener('click', async e => {
  if (S.tab !== 'instagram' || !IG.settings) return;
  const add = e.target.closest('[data-ig-add]');
  if (add) {
    if (add.dataset.igAdd === 'keyword') {
      IG.settings.rules.push({id: igId(), name: '새 규칙', enabled: true, post: '', keywords: [],
        replies: ['🌙 별빛이 닿았어요. DM을 살짝 열어보세요 ✨'], dm: '', appendPromo: true});
    } else {
      const post = prompt('번호를 고르게 할 게시물 주소를 붙여넣어 주세요\n(예: https://www.instagram.com/p/ABC123/)');
      if (post === null) return;
      const name = prompt('이 게시물을 부를 이름 (예: 10월 연애운 픽카드)', '픽카드') || '픽카드';
      for (const n of [1, 2, 3]) IG.settings.rules.push({
        id: igId(), name: `${name} ${n}번`, enabled: true, post: IG.lib.toShortcode(post), keywords: [`${n}번`],
        replies: [`🔮 ${n}번 카드의 이야기를 DM으로 보내드렸어요 ✨`, `🌙 ${n}번을 고른 당신에게, 카드의 속삭임을 DM으로 전했어요 💌`],
        dm: `🔮 ${n}번 카드를 고른 당신에게\n\n(여기에 ${n}번 리딩을 적어주세요)`, appendPromo: true,
      });
    }
    IG.dirty = true; render();
    return;
  }
  const del = e.target.closest('[data-ig-del]');
  if (del) {
    const r = IG.settings.rules[+del.dataset.igDel];
    if (!confirm(`"${r.name || '이름 없는 규칙'}" 규칙을 삭제할까요? (저장해야 반영돼요)`)) return;
    IG.settings.rules.splice(+del.dataset.igDel, 1);
    IG.dirty = true; render();
    return;
  }
  if (e.target.closest('[data-ig-reload]')) {
    if (IG.dirty && !confirm('저장하지 않은 변경을 버리고 저장된 내용으로 되돌릴까요?')) return;
    IG.settings = null; render();
    return;
  }
  if (e.target.closest('[data-ig-save]')) {
    const rules = IG.settings.rules.map(r => ({
      id: r.id || igId(), name: String(r.name || '').trim(), enabled: r.enabled !== false,
      post: IG.lib.toShortcode(r.post), keywords: (r.keywords || []).map(s => s.trim()).filter(Boolean),
      replies: (r.replies || []).map(s => s.trim()).filter(Boolean), dm: String(r.dm || ''), appendPromo: !!r.appendPromo,
    }));
    const empty = rules.filter(r => r.enabled && !r.keywords.length);
    if (empty.length && !confirm(`키워드가 없는 규칙 ${empty.length}개는 반응하지 않아요. 그래도 저장할까요?`)) return;
    try {
      await setDoc(doc(db, 'ig_config', 'settings'), {
        promo: IG.settings.promo, rules, updatedAt: serverTimestamp(), updatedBy: S.me.email,
        followGate: IG.settings.followGate !== false,
        ...Object.fromEntries(['gateText', 'notFollowingText', 'buttonText', 'readingButton', 'seminarButton']
          .map(k => [k, String(IG.settings[k] ?? '')])),
      });
      IG.settings.rules = rules; IG.dirty = false;
      toast('저장했어요. 1분 안에 댓글 자동응답에 적용돼요');
      render();
    } catch (err) { toast('저장 실패: ' + (err.code || err.message)); }
  }
});
window.addEventListener('beforeunload', e => { if (IG.dirty || LG.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ═══════════════════════════════════════
   회계장부 (관리자만)
   ledger/{id}         : 입출금 한 건
   ledgerReceipts/{id} : 영수증 사진 (줄인 JPEG data URL, 같은 ID). 목록을 가볍게 하려고 따로 둔다
   사진을 올리면 api/receipt 가 날짜·금액·거래처를 읽어 칸을 채운다 → 확인 후 저장
═══════════════════════════════════════ */
const LG_CATS = {
  in: ['세미나 참가비', '상담료', '굿즈 판매', '후원·지원금', '기타 수입'],
  out: ['장소 대관', '다과·식비', '광고·마케팅', '인쇄·굿즈 제작', '교통비', '소모품', '소프트웨어·구독', '인건비', '기타 지출'],
};
const LG_METHODS = ['카드', '현금', '계좌이체'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const lgBlank = () => ({type: 'out', date: todayStr(), amount: '', category: '', item: '', vendor: '', method: '', memo: '',
  paidBy: '', bank: '', account: '', holder: '', reimbursed: false});

const LG = {
  items: null, loading: false, month: todayStr().slice(0, 7), typeFilter: '',
  form: lgBlank(), editId: null, dirty: false,
  image: null,         // 이번에 새로 고른 사진 (data URL)
  receipt: 'none',     // none | keep(기존 유지) | new | remove
  ocr: '',             // '' | busy | 결과 안내 문구
  receipts: new Map(), // id → data URL 캐시
  payees: new Map(),   // 이름 → {bank, account, holder} (개인 돈으로 쓴 사람의 정산 계좌)
  viewer: null,
};

async function loadLedger() {
  if (LG.loading) return;
  LG.loading = true;
  try {
    const [snap, ps] = await Promise.all([
      getDocs(query(collection(db, 'ledger'), orderBy('date', 'desc'))),
      getDocs(collection(db, 'ledgerPayees')),
    ]);
    LG.items = snap.docs.map(d => ({id: d.id, ...d.data()}));
    LG.payees = new Map(ps.docs.map(d => [d.data().name || d.id, d.data()]));
  } catch (e) {
    toast('회계장부를 불러오지 못했어요: ' + (e.code || e.message));
  }
  LG.loading = false;
  if (S.tab === 'ledger' && LG.items) render();
}

const lgSort = (a, b) => b.date.localeCompare(a.date) || ms(b.createdAt) - ms(a.createdAt);

function renderLedger() {
  if (!LG.items) { loadLedger(); return '<div class="empty">불러오는 중…</div>'; }
  const inMonth = LG.items.filter(x => !LG.month || x.date.startsWith(LG.month)).sort(lgSort);
  const shown = inMonth.filter(x => !LG.typeFilter || x.type === LG.typeFilter);
  const sum = (arr, t) => arr.filter(x => x.type === t).reduce((a, x) => a + (x.amount || 0), 0);
  const mIn = sum(inMonth, 'in'), mOut = sum(inMonth, 'out');
  const balance = sum(LG.items, 'in') - sum(LG.items, 'out');
  const period = LG.month ? `${+LG.month.slice(5)}월` : '전체 기간';

      </div>
      <button class="btn sm" data-lg-csv style="margin-left:auto">엑셀(CSV) 내려받기</button>

// 휴대폰 사진(수 MB)을 Firestore 문서 한 개(1MB)에 들어가게 줄인다
async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => {
      const i = new Image();
      i.onload = () => ok(i);
      i.onerror = () => bad(new Error('사진을 열 수 없어요 (HEIC 사진은 JPG로 바꿔 올려주세요)'));
      i.src = url;
    });
    for (const [max, q] of [[1600, .82], [1280, .75], [1024, .7], [800, .65]]) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q);
      if (d.length < 750000) return d;
    }
    throw new Error('사진이 너무 커요');
  } finally { URL.revokeObjectURL(url); }
}

async function readReceipt() {
  const image = LG.image;
  LG.ocr = 'busy'; render();
  try {
    const resp = await fetch('/api/receipt', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + await auth.currentUser.getIdToken()},
      body: JSON.stringify({image, inCategories: LG_CATS.in, outCategories: LG_CATS.out}),
    });
    const r = await resp.json().catch(() => ({}));
    if (LG.image !== image) return; // 그 사이 사진을 바꿨다
    if (!resp.ok) throw new Error(r.error || resp.status);
    const f = LG.form;
    if (!r.amount) { LG.ocr = '<b style="color:var(--warn)">금액을 찾지 못했어요. 직접 적어주세요</b>'; return; }
    f.type = r.type; f.amount = String(r.amount);
    if (r.date) f.date = r.date;
    if (r.category) f.category = r.category;
    else if (!LG_CATS[f.type].includes(f.category)) f.category = '';
    for (const k of ['vendor', 'item', 'method']) if (r[k]) f[k] = r[k];
    LG.dirty = true;
    LG.ocr = r.confidence === 'high'
      ? `✅ <b>${won(r.amount)}</b>${r.vendor ? ` · ${esc(r.vendor)}` : ''} 로 읽었어요. 확인 후 저장하세요`
      : `<b style="color:var(--warn)">⚠️ ${won(r.amount)}로 읽었지만 흐릿해요. 금액을 꼭 확인해주세요</b>`;
  } catch (e) {
    if (LG.image === image) LG.ocr = `<b style="color:var(--bad)">영수증을 읽지 못했어요 (${esc(e.message)}). 직접 적어주세요</b>`;
  } finally {
    if (S.tab === 'ledger') render();
  }
}

async function getReceipt(id) {
  if (!LG.receipts.has(id)) {
    const snap = await getDoc(doc(db, 'ledgerReceipts', id));
    LG.receipts.set(id, snap.exists() ? snap.data().image : null);
  }
  return LG.receipts.get(id);
}

/* ── 개인 돈 정산: 출금을 누가 자기 돈으로 냈는지 적어 두고, 사람별로 모아서 돌려준다 ── */
const payeeId = name => name.replace(/\//g, '·');
const lgPayee = name => {
  const p = (name && LG.payees.get(name.trim())) || {};
  return {bank: p.bank || '', account: p.account || '', holder: p.holder || ''};
};
const lgPayerNames = () => [...new Set([...LG.payees.keys(), ...S.users.map(u => u.name), ...LG.items.map(x => x.paidBy)].filter(Boolean))];
const lgPending = () => LG.items.filter(x => x.type === 'out' && x.paidBy && !x.reimbursedAt);

function renderReimburse() {
  const groups = new Map();
  lgPending().forEach(x => { if (!groups.has(x.paidBy)) groups.set(x.paidBy, []); groups.get(x.paidBy).push(x); });
  if (!groups.size) return '';
  const cards = [...groups].map(([name, list]) => {
    const total = list.reduce((a, x) => a + x.amount, 0), p = lgPayee(name);
    const acct = p.account ? `${esc(p.bank)} ${esc(p.account)} <span class="muted">(${esc(p.holder || name)})</span>` : '<span style="color:var(--warn)">계좌 미등록 — 내역을 열어 계좌를 적어주세요</span>';
    return `<div class="item" data-lg-payer="${esc(name)}">
      <div class="top"><b>${esc(name)}</b><span class="v lg-out">${won(total)}</span></div>
      <div class="small" style="margin-bottom:8px">${acct}</div>
      <div class="btn-row" style="margin-bottom:6px">
        ${p.account ? '<button class="btn sm" data-lg-copy="acct">계좌 복사</button>' : ''}
        <button class="btn sm" data-lg-copy="amount">금액 복사</button>
        <button class="btn sm primary" data-lg-paid>송금 완료로 표시</button>
      </div>
      <details class="small muted"><summary style="cursor:pointer">${list.length}건 보기</summary>
        ${list.sort(lgSort).map(x => `<div>${esc(x.date.slice(5).replace('-', '/'))} ${esc(x.item || x.category || '')} · ${won(x.amount)}</div>`).join('')}
      </details>
    </div>`;
  }).join('');
  return `<div class="panel"><h3>돌려줄 돈 <span class="muted small" style="font-weight:400">개인 돈으로 낸 출금 중 아직 정산 안 된 것 · 전체 기간</span></h3>
    <div class="gng">${cards}</div></div>`;
}

function lgReset() {
  Object.assign(LG, {form: lgBlank(), editId: null, dirty: false, image: null, receipt: 'none', ocr: ''});
}

function lgCsv() {
  const list = LG.items.filter(x => !LG.month || x.date.startsWith(LG.month)).sort((a, b) => lgSort(b, a));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['날짜', '구분', '분류', '내용', '거래처', '결제수단', '입금', '출금', '메모', '영수증', '개인 지출자', '정산'].join(',')];
  list.forEach(x => lines.push([x.date, x.type === 'in' ? '입금' : '출금', x.category, x.item, x.vendor, x.method,
    x.type === 'in' ? x.amount : '', x.type === 'out' ? x.amount : '', x.memo, x.hasReceipt ? 'O' : '', x.paidBy || '', x.paidBy ? (x.reimbursedAt ? '완료' : '대기') : ''].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv'}));
  a.download = `별빛타로_회계장부_${LG.month || '전체'}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('input', e => {
  if (S.tab !== 'ledger' || !LG.items) return;
  const t = e.target;
  if (t.dataset.lgF) { LG.form[t.dataset.lgF] = t.value; LG.dirty = true; }
});
document.addEventListener('change', async e => {
  if (S.tab !== 'ledger' || !LG.items) return;
  const t = e.target;
  if (t.id === 'lg-month') { LG.month = t.value; render(); return; }
  if (t.dataset.lgF === 'paidBy') {
    // 아는 이름이면 계좌를 채우고, 칸이 새로 나타나도록 다시 그린다
    const f = LG.form; f.paidBy = t.value; LG.dirty = true;
    if (LG.payees.has(f.paidBy.trim())) Object.assign(f, lgPayee(f.paidBy));
    render(); return;
  }
  if (t.dataset.lgF) { LG.form[t.dataset.lgF] = t.value; LG.dirty = true; return; }
  if (t.dataset.lgReimbursed !== undefined) { LG.form.reimbursed = t.checked; LG.dirty = true; return; }
  if (t.id === 'lg-file' && t.files[0]) {
    try {
      LG.image = await shrinkImage(t.files[0]);
      LG.receipt = 'new'; LG.dirty = true;
      readReceipt();
    } catch (err) { toast(err.message); }
  }
});
document.addEventListener('click', async e => {
  if (S.tab !== 'ledger' || !LG.items) return;
  const t = e.target;
  if (t.closest('[data-lg-close]')) { LG.viewer = null; render(); return; }
  const view = t.closest('[data-lg-view]');
  if (view) {
    LG.viewer = 'loading'; render();
    try { LG.viewer = await getReceipt(view.dataset.lgView); if (!LG.viewer) toast('영수증 사진이 없어요'); }
    catch (err) { LG.viewer = null; toast('불러오기 실패: ' + (err.code || err.message)); }
    render(); return;
  }
  if (t.closest('[data-lg-zoom]')) { LG.viewer = t.closest('[data-lg-zoom]').src; render(); return; }
  const mo = t.closest('[data-lg-month]');
  if (mo) {
    const v = mo.dataset.lgMonth;
    if (v === 'all') LG.month = '';
    else {
      const [y, m] = (LG.month || todayStr().slice(0, 7)).split('-').map(Number);
      const d = new Date(y, m - 1 + +v, 1);
      LG.month = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    }
    render(); return;
  }
  const tf = t.closest('[data-lg-type]');
  if (tf) { LG.typeFilter = tf.dataset.lgType; render(); return; }
  if (t.closest('[data-lg-csv]')) { lgCsv(); return; }
  const payer = t.closest('[data-lg-payer]');
  if (payer) {
    const name = payer.dataset.lgPayer, list = lgPending().filter(x => x.paidBy === name);
    const total = list.reduce((a, x) => a + x.amount, 0), p = lgPayee(name);
    const cp = t.closest('[data-lg-copy]');
    if (cp) {
      const text = cp.dataset.lgCopy === 'acct' ? `${p.bank} ${p.account} ${p.holder || name}`.trim() : String(total);
      try { await navigator.clipboard.writeText(text); toast(`복사했어요: ${text}`); }
      catch { prompt('복사해서 쓰세요', text); }
      return;
    }
    if (t.closest('[data-lg-paid]')) {
      if (!confirm(`${name}님에게 ${won(total)} (${list.length}건) 보냈나요?\n정산 완료로 표시해요.`)) return;
      try {
        const b = writeBatch(db);
        list.forEach(x => b.update(doc(db, 'ledger', x.id), {reimbursedAt: serverTimestamp(), updatedAt: serverTimestamp(), updatedBy: S.me.name}));
        await b.commit();
        const now = Timestamp.now();
        list.forEach(x => { x.reimbursedAt = now; });
        toast(`${name}님 정산 완료로 표시했어요`); render();
      } catch (err) { toast('저장 실패: ' + (err.code || err.message)); }
      return;
    }
    return;
  }
  const st = t.closest('[data-lg-settype]');
  if (st) {
    LG.form.type = st.dataset.lgSettype;
    if (!LG_CATS[LG.form.type].includes(LG.form.category)) LG.form.category = '';
    LG.dirty = true; render(); return;
  }
  if (t.closest('[data-lg-ocr]')) { readReceipt(); return; }
  if (t.closest('[data-lg-rmpic]')) {
    LG.receipt = LG.editId && LG.items.find(x => x.id === LG.editId)?.hasReceipt ? 'remove' : 'none';
    LG.image = null; LG.ocr = ''; LG.dirty = true; render(); return;
  }
  if (t.closest('[data-lg-cancel]')) { lgReset(); render(); return; }
  const ed = t.closest('[data-lg-edit]');
  if (ed) {
    if (LG.dirty && !confirm('적던 내용을 버리고 이 내역을 열까요?')) return;
    const x = LG.items.find(i => i.id === ed.dataset.lgEdit);
    lgReset();
    LG.editId = x.id;
    LG.form = {type: x.type, date: x.date, amount: String(x.amount), category: x.category || '', item: x.item || '',
      vendor: x.vendor || '', method: x.method || '', memo: x.memo || '',
      paidBy: x.paidBy || '', ...lgPayee(x.paidBy), reimbursed: !!x.reimbursedAt};
    LG.receipt = x.hasReceipt ? 'keep' : 'none';
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
    if (x.hasReceipt) getReceipt(x.id).then(() => { if (LG.editId === x.id) render(); }).catch(() => {});
    return;
  }
  if (t.closest('[data-lg-del]')) {
    const x = LG.items.find(i => i.id === LG.editId);
    if (!confirm(`${x.date} ${x.item || x.category || ''} ${won(x.amount)} 내역을 삭제할까요?`)) return;
    try {
      const b = writeBatch(db);
      b.delete(doc(db, 'ledger', x.id));
      if (x.hasReceipt) b.delete(doc(db, 'ledgerReceipts', x.id));
      await b.commit();
      LG.items = LG.items.filter(i => i.id !== x.id);
      LG.receipts.delete(x.id);
      lgReset(); toast('삭제했어요'); render();
    } catch (err) { toast('삭제 실패: ' + (err.code || err.message)); }
    return;
  }
  if (t.closest('[data-lg-save]')) {
    const f = LG.form, amount = parseInt(String(f.amount).replace(/[^\d]/g, ''), 10);
    if (!amount) { toast('금액을 적어주세요'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) { toast('날짜를 골라주세요'); return; }
    const id = LG.editId || doc(collection(db, 'ledger')).id;
    const prev = LG.items.find(i => i.id === id);
    const paidBy = f.type === 'out' ? f.paidBy.trim() : '';
    const payee = paidBy && {name: paidBy, bank: f.bank.trim(), account: f.account.trim(), holder: f.holder.trim()};
    const old = paidBy && lgPayee(paidBy);
    const payeeChanged = payee && (payee.bank || payee.account) &&
      ['bank', 'account', 'holder'].some(k => payee[k] !== old[k]);
    const data = {
      type: f.type, date: f.date, amount, hasReceipt: LG.receipt === 'new' || LG.receipt === 'keep',
      ...Object.fromEntries(['category', 'item', 'vendor', 'method', 'memo'].map(k => [k, String(f[k] || '').trim()])),
      paidBy, reimbursedAt: paidBy && f.reimbursed ? (prev && prev.reimbursedAt) || serverTimestamp() : null,
      updatedAt: serverTimestamp(), updatedBy: S.me.name,
      ...(prev ? {} : {createdAt: serverTimestamp(), createdBy: S.me.name}),
    };
    try {
      const b = writeBatch(db);
      b.set(doc(db, 'ledger', id), data, {merge: true});
      if (LG.receipt === 'new') b.set(doc(db, 'ledgerReceipts', id), {image: LG.image, createdAt: serverTimestamp()});
      if (LG.receipt === 'remove') b.delete(doc(db, 'ledgerReceipts', id));
      if (payeeChanged) b.set(doc(db, 'ledgerPayees', payeeId(paidBy)), {...payee, updatedAt: serverTimestamp()});
      await b.commit();
      if (payeeChanged) LG.payees.set(paidBy, payee);
      if (LG.receipt === 'new') LG.receipts.set(id, LG.image);
      if (LG.receipt === 'remove') LG.receipts.delete(id);
      LG.items = [...LG.items.filter(i => i.id !== id),
        {...prev, id, ...data, updatedAt: Timestamp.now(), createdAt: prev ? prev.createdAt : Timestamp.now(),
          reimbursedAt: IS_NOW(data.reimbursedAt) ? Timestamp.now() : data.reimbursedAt}];
      if (LG.month && !f.date.startsWith(LG.month)) LG.month = f.date.slice(0, 7);
      lgReset(); toast(prev ? '수정했어요' : '저장했어요'); render();
    } catch (err) { toast('저장 실패: ' + (err.code || err.message)); }
  }
});

/* ═══════════════════════════════════════
   조직도 (관리자) — MyeongRi 조직도와 같은 구조
   상자 하나 = orgChart 문서 하나. parentId('' = 맨 위)와 형제 순서 order 로 나무가 된다.
   옮기기·지우기는 형제 순서까지 한 batch 로 고친다 (중간에 끊기면 순서가 어긋난다).
═══════════════════════════════════════ */
const OG_COLORS = {none: ['#ffffff', '#d9d3c6'], gold: ['#faf1dc', '#ecd9a8'], green: ['#e9f6ee', '#bfe3cc'],
  blue: ['#e9eff8', '#c3d2ea'], rose: ['#fbe9e6', '#f0c9c4'], gray: ['#f1eee7', '#ddd7cb']};
const OG_FIELDS = ['uid', 'name', 'title', 'phone', 'note', 'color'];
const ogBlank = () => ({uid: '', name: '', title: '', phone: '', note: '', color: 'none', parentId: ''});

const OG = {
  nodes: null, loading: false, busy: false,
  sel: null, form: ogBlank(), dirty: false,
  folded: new Set(),   // 접은 상자 (이 브라우저에서만 기억)
  search: '',
  drag: null,          // 끌고 있는 상자 id
};

async function fetchOrg() {
  const snap = await getDocs(collection(db, 'orgChart'));
  OG.nodes = snap.docs.map(d => ({id: d.id, ...d.data()}));
}
async function loadOrg() {
  if (OG.loading) return;
  OG.loading = true;
  try {
    await fetchOrg();
    try { OG.folded = new Set(JSON.parse(localStorage.getItem('og-folded') || '[]')); } catch {}
  } catch (e) {
    toast('조직도를 불러오지 못했어요: ' + (e.code || e.message));
  }
  OG.loading = false;
  if (S.tab === 'org' && OG.nodes) render();
  // 이름이 가입자 한 명과 똑같은 상자는 알아서 계정과 연결한다 (역할·위치는 안 바뀐다)
  if (OG.nodes && ogLinkCandidates().length) {
    const c = ogLinkCandidates();
    await ogCommit(c.map(([n, u]) => ['upd', n.id, {uid: u.uid, phone: u.phone || n.phone || '', ...ogStamp()}]),
      `이름이 같은 ${c.length}명을 계정과 연결했어요`);
  }
}
const ogSaveFolded = () => { try { localStorage.setItem('og-folded', JSON.stringify([...OG.folded])); } catch {} };

const ogNode = id => OG.nodes.find(n => n.id === id);
const ogKids = pid => OG.nodes.filter(n => (n.parentId || '') === pid).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
// 계정(uid)과 연결된 상자는 이름·전화번호·역할을 가입자 정보에서 가져온다.
// 역할은 여기서도 체크박스로만 바뀌고, 상자를 옮기는 것으로는 절대 바뀌지 않는다.
const ogUser = n => n.uid ? S.users.find(u => u.uid === n.uid) || null : null;
const ogName = n => ogUser(n)?.name || n.name || '';
const ogPhone = n => n.uid && ogUser(n) ? ogUser(n).phone || '' : n.phone || '';
const OG_ROLES = [['admin', '관리자'], ['leader', '리더'], ['caller', '콜러'], ['seminarStaff', '세미나 스태프'], ['marketing', '마케팅']];
const ogRoleNames = u => u.email === SUPER_ADMIN_EMAIL ? ['최고 관리자', ...OG_ROLES.slice(1).filter(([k]) => u.roles?.[k]).map(([, l]) => l)]
  : OG_ROLES.filter(([k]) => u.roles?.[k]).map(([, l]) => l);
const ogNoLink = u => !!u.roles?.caller && !KAKAO_LINK_RE.test(u.kakaoLink || '');
const ogLabel = n => [ogName(n), n.title].filter(Boolean).join(' · ') || '(빈 상자)';
// a 가 b 자신이거나 b 아래에 있나 — 자기 아래로 옮기면 고리가 생겨 그려지지 않는다
function ogUnder(a, b) {
  for (let p = a, guard = 0; p && guard < 2000; p = ogNode(p)?.parentId || '', guard++) if (p === b) return true;
  return false;
}
// id 와 그 아래 전부
function ogBranch(id) {
  const out = [id];
  for (let i = 0; i < out.length; i++) OG.nodes.forEach(n => { if (n.parentId === out[i]) out.push(n.id); });
  return out;
}
// 나무 순서대로 펼친 목록 [{n, depth}] (skipFolded 면 접힌 가지는 뺀다)
function ogFlat(skipFolded = false) {
  const out = [];
  const walk = (pid, depth) => ogKids(pid).forEach(n => {
    out.push({n, depth});
    if (!(skipFolded && OG.folded.has(n.id))) walk(n.id, depth + 1);
  });
  walk('', 0);
  return out;
}

function ogSelect(id) {
  const n = id && ogNode(id);
  OG.sel = n ? id : null;
  OG.dirty = false;
  OG.form = n ? Object.fromEntries(Object.entries(ogBlank()).map(([k, v]) => [k, n[k] ?? v])) : ogBlank();
}

// ops: [['set'|'upd'|'del', id, data]] — 450개씩 끊어 batch 로 보내고 화면 데이터에도 반영한다
async function ogCommit(ops, msg) {
  if (OG.busy || !ops.length) return false;
  OG.busy = true;
  try {
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db);
      ops.slice(i, i + 450).forEach(([t, id, data]) => {
        const ref = doc(db, 'orgChart', id);
        if (t === 'del') b.delete(ref); else if (t === 'set') b.set(ref, data); else b.update(ref, data);
      });
      await b.commit();
    }
    ops.forEach(([t, id, data]) => {
      if (t === 'del') OG.nodes = OG.nodes.filter(n => n.id !== id);
      else if (t === 'set') OG.nodes.push({id, ...data});
      else Object.assign(ogNode(id), data);
    });
    if (msg) toast(msg);
    return true;
  } catch (e) {
    toast('저장 실패: ' + (e.code || e.message));
    return false;
  } finally {
    OG.busy = false;
    render();
  }
}

const ogStamp = () => ({updatedAt: Date.now(), updatedBy: S.me.name});

// parentId 아래 index 자리로 옮긴다 (index 는 옮기는 상자를 뺀 형제 목록 기준)
async function ogMove(id, parentId, index) {
  if (parentId && ogUnder(parentId, id)) { toast('자기 아래로는 옮길 수 없어요'); return; }
  const node = ogNode(id), from = node.parentId || '';
  const target = ogKids(parentId).filter(n => n.id !== id);
  target.splice(Math.max(0, Math.min(index, target.length)), 0, node);
  const want = target.map((n, i) => [n.id, n.id === id ? {parentId, order: i} : {order: i}]);
  if (from !== parentId) ogKids(from).filter(n => n.id !== id).forEach((n, i) => want.push([n.id, {order: i}]));
  const ops = want.filter(([nid, d]) => Object.entries(d).some(([k, v]) => (ogNode(nid)[k] ?? '') !== v))
    .map(([nid, d]) => ['upd', nid, nid === id ? {...d, ...ogStamp()} : d]);
  if (!ops.length) return;
  if (parentId) { OG.folded.delete(parentId); ogSaveFolded(); }
  if (await ogCommit(ops, '옮겼어요') && OG.sel === id) { OG.form.parentId = parentId; render(); }
}

async function ogAdd(parentId, index = null) {
  const sibs = ogKids(parentId);
  if (index === null) index = sibs.length;
  const id = doc(collection(db, 'orgChart')).id;
  const ops = [];
  sibs.forEach((n, i) => { const o = i < index ? i : i + 1; if (n.order !== o) ops.push(['upd', n.id, {order: o}]); });
  ops.push(['set', id, {...ogBlank(), parentId, order: index, createdAt: Date.now(), ...ogStamp()}]);
  if (parentId) { OG.folded.delete(parentId); ogSaveFolded(); }
  if (await ogCommit(ops)) {
    ogSelect(id); render();
    $('[data-og-f=name]')?.focus();
  }
}

async function ogDelete(id) {
  const n = ogNode(id), ids = ogBranch(id);
  if (!confirm(ids.length > 1 ? `「${ogLabel(n)}」와 그 아래 ${ids.length - 1}개 상자를 모두 지울까요?` : `「${ogLabel(n)}」 상자를 지울까요?`)) return;
  const ops = ids.map(x => ['del', x]);
  ogKids(n.parentId || '').filter(x => x.id !== id).forEach((x, i) => { if (x.order !== i) ops.push(['upd', x.id, {order: i}]); });
  if (await ogCommit(ops, '지웠어요')) { ogSelect(null); render(); }
}

async function ogSave() {
  const n = ogNode(OG.sel);
  if (!n || !OG.dirty) return;
  const data = Object.fromEntries(OG_FIELDS.map(k => [k, String(OG.form[k] || '').trim()]));
  if (!OG_COLORS[data.color]) data.color = 'none';
  const u = data.uid && S.users.find(x => x.uid === data.uid);
  if (data.uid && !u) data.uid = '';
  if (u) Object.assign(data, {name: String(u.name || '').slice(0, 30), phone: u.phone || ''}); // 계정이 지워져도 남도록 복사해 둔다
  const parentId = OG.form.parentId || '';
  if (!await ogCommit([['upd', n.id, {...data, ...ogStamp()}]], '저장했어요')) return;
  OG.dirty = false;
  if (parentId !== (n.parentId || '')) await ogMove(n.id, parentId, ogKids(parentId).length);
  render();
}

// 역할 등록 명단으로 초안 — 별빛타로 → 관리자 / 리더 / 콜러 → 사람 (여러 역할이면 가장 높은 쪽 한 곳)
async function ogSeed() {
  const rank = u => u.email === SUPER_ADMIN_EMAIL || u.roles?.admin ? 'admin' : u.roles?.leader ? 'leader' : u.roles?.caller ? 'caller' : '';
  const staff = S.users.filter(rank);
  if (!staff.length) { toast('역할이 지정된 사람이 없어요'); return; }
  if (!confirm(`역할 등록 명단 ${staff.length}명으로 조직도 초안을 만들까요?\n만든 뒤에 자유롭게 고치고 옮길 수 있어요.`)) return;
  const ops = [], now = Date.now();
  const add = (parentId, order, d) => {
    const id = doc(collection(db, 'orgChart')).id;
    ops.push(['set', id, {...ogBlank(), ...d, parentId, order, createdAt: now, ...ogStamp()}]);
    return id;
  };
  const root = add('', ogKids('').length, {title: '별빛타로', color: 'gold'});
  [['admin', '관리자', 'blue'], ['leader', '리더', 'green'], ['caller', '콜러', 'rose']]
    .map(([k, label, color]) => [label, color, staff.filter(u => rank(u) === k)])
    .filter(([, , us]) => us.length)
    .forEach(([label, color, us], gi) => {
      const g = add(root, gi, {title: label, color});
      us.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'))
        .forEach((u, i) => add(g, i, {uid: u.uid, name: String(u.name || u.email).slice(0, 30), phone: u.phone || '', title: u.email === SUPER_ADMIN_EMAIL ? '최고 관리자' : ''}));
    });
  await ogCommit(ops, `상자 ${ops.length}개를 만들었어요`);
}

// 아직 연결 안 된 상자 중 이름이 가입자 한 명과 똑같은 것 → [[상자, 계정]]
function ogLinkCandidates() {
  const byName = new Map();
  S.users.forEach(u => { const k = (u.name || '').trim(); if (k) byName.set(k, byName.has(k) ? null : u); }); // 같은 이름 두 명이면 건너뛴다
  const placed = new Set(OG.nodes.filter(n => n.uid).map(n => n.uid));
  const out = [];
  OG.nodes.forEach(n => {
    const u = !n.uid && byName.get((n.name || '').trim());
    if (u && !placed.has(u.uid)) { out.push([n, u]); placed.add(u.uid); }
  });
  return out;
}
async function ogAutoLink() {
  const c = ogLinkCandidates();
  if (!c.length) return;
  if (!confirm(`이름이 같은 가입자와 상자 ${c.length}개를 연결할까요?\n\n${c.map(([n, u]) => `${n.name} → ${u.email}`).join('\n')}`)) return;
  await ogCommit(c.map(([n, u]) => ['upd', n.id, {uid: u.uid, phone: u.phone || n.phone || '', ...ogStamp()}]), `${c.length}명을 계정과 연결했어요`);
}

// 역할을 받으면 조직도에도 들어간다: 콜러 → '콜링' 팀, 리더 → '리더' 팀 (이름 없이 직함만 있는 상자)
const OG_TEAM = {caller: '콜링', leader: '리더'};
const ogTeamBox = role => OG_TEAM[role] && OG.nodes.find(n => !n.uid && !n.name && (n.title || '').includes(OG_TEAM[role]));
const ogTeamRole = u => ['caller', 'leader'].find(r => u.roles?.[r] && ogTeamBox(r));
// 역할은 있는데 조직도에 연결된 상자가 없는 사람
const ogMissing = () => {
  const placed = new Set(OG.nodes.filter(n => n.uid).map(n => n.uid));
  return S.users.filter(u => !placed.has(u.uid) && (u.email === SUPER_ADMIN_EMAIL || OG_ROLES.some(([k]) => u.roles?.[k])));
};
// u 를 역할에 맞는 팀 상자 아래에 넣는다 (팀 상자가 없으면 맨 위 줄). 이미 있으면 아무것도 안 한다
async function ogPlace(u, quiet = false) {
  if (OG.nodes.some(n => n.uid === u.uid)) return false;
  const role = ogTeamRole(u), team = role ? ogTeamBox(role) : null, pid = team ? team.id : '';
  const id = doc(collection(db, 'orgChart')).id;
  const ok = await ogCommit([['set', id, {...ogBlank(), uid: u.uid, name: String(u.name || u.email).slice(0, 30), phone: u.phone || '',
    parentId: pid, order: ogKids(pid).length, createdAt: Date.now(), ...ogStamp()}]],
    quiet ? '' : `${u.name}님을 ${team ? team.title : '맨 위 줄'}에 넣었어요`);
  if (ok && pid) { OG.folded.delete(pid); ogSaveFolded(); }
  return ok;
}
// 역할 등록에서 콜러·리더를 켜면 불린다
async function ogPlaceForRole(uid, role) {
  if (!OG_TEAM[role]) return;
  try { if (!OG.nodes) await fetchOrg(); } catch { return; }
  const u = S.users.find(x => x.uid === uid);
  if (!u || OG.nodes.some(n => n.uid === uid) || !ogTeamBox(role)) return;
  if (await ogPlace(u, true)) toast(`${u.name}: ${role === 'caller' ? '콜러' : '리더'} 등록 · 조직도 ${ogTeamBox(role).title}에 추가`);
}

/* ── 내보내기: 화면에 펼쳐 둔 그대로 SVG 로 다시 그려 PNG·인쇄 (MyeongRi orgExport 와 같은 방식) ── */
function ogSvg() {
  const rows = ogFlat(true), ROW = 46, INDENT = 26, BOX_W = 300, PAD = 20, top = 56;
  const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  const maxDepth = rows.reduce((m, r) => Math.max(m, r.depth), 0);
  const width = PAD * 2 + maxDepth * INDENT + BOX_W, height = top + rows.length * ROW + PAD;
  const heading = `별빛타로 조직도 (${todayStr().replace(/-/g, '.')})`;
  const parts = [`<rect width="${width}" height="${height}" fill="#f6f4fa"/>`,
    `<text x="${PAD}" y="34" font-family="sans-serif" font-size="19" font-weight="700" fill="#221a33">${esc(heading)}</text>`];
  rows.forEach(({n, depth}, i) => {
    const x = PAD + depth * INDENT, y = top + i * ROW, [bg, line] = OG_COLORS[n.color] || OG_COLORS.none;
    if (depth > 0) {
      const vx = PAD + (depth - 1) * INDENT + 12;
      let up = y;
      for (let k = i - 1; k >= 0; k--) if (rows[k].depth < depth) { up = top + k * ROW + ROW - 8; break; }
      parts.push(`<path d="M${vx} ${up} V${y + ROW / 2 - 4} H${x}" fill="none" stroke="#d6cfe3" stroke-width="1.5"/>`);
    }
    parts.push(`<rect x="${x}" y="${y}" width="${BOX_W}" height="${ROW - 8}" rx="8" fill="${bg}" stroke="${line}"/>`);
    const u = ogUser(n);
    const sub = [ogPhone(n) ? fmtPhone(ogPhone(n)) : '', u ? ogRoleNames(u).join('·') : '', n.note].filter(Boolean).join(' · ');
    parts.push(`<text x="${x + 12}" y="${y + (sub ? 17 : 24)}" font-family="sans-serif" font-size="14" font-weight="600" fill="#221a33">${esc(cut(ogLabel(n), 26))}</text>`);
    if (sub) parts.push(`<text x="${x + 12}" y="${y + 31}" font-family="sans-serif" font-size="11" fill="#7a7090">${esc(cut(sub, 44))}</text>`);
  });
  return {heading, width, height,
    svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${parts.join('')}</svg>`};
}

async function ogDownloadPng() {
  const {svg, width, height} = ogSvg();
  try {
    const img = await new Promise((ok, bad) => {
      const i = new Image();
      i.onload = () => ok(i); i.onerror = () => bad(new Error('그림을 만들지 못했어요'));
      i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
    // 인쇄해도 글자가 또렷하게 2배로 뜬다
    const c = document.createElement('canvas');
    c.width = width * 2; c.height = height * 2;
    const ctx = c.getContext('2d');
    ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png'); a.download = `별빛타로_조직도_${todayStr()}.png`; a.click();
  } catch (e) { toast(e.message); }
}

function ogPrint() {
  const {svg, heading} = ogSvg();
  const w = window.open('', '_blank', 'width=900,height=700');
  if (!w) { toast('인쇄 창이 막혀 있어요. 팝업을 허용해주세요'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(heading)}</title>` +
    `<style>body{margin:0;padding:16px;background:#fff}svg{max-width:100%;height:auto}</style></head>` +
    `<body>${svg}<script>window.onload=()=>{window.focus();window.print();}<\/script></body></html>`);
  w.document.close();
}

/* ── 화면 ── */
function renderOrg() {
  if (!OG.nodes) { loadOrg(); return '<div class="empty">불러오는 중…</div>'; }
  const q = OG.search.trim().toLowerCase();
  const hits = q ? new Set(OG.nodes.filter(n => [ogName(n), n.title, ogPhone(n), n.note, ...(ogUser(n) ? ogRoleNames(ogUser(n)) : [])].join(' ').toLowerCase().includes(q)).map(n => n.id)) : null;
  // 찾은 상자가 보이도록 위쪽 가지는 펼쳐서 그린다
  const open = new Set();
  if (hits) hits.forEach(id => { for (let p = ogNode(id).parentId; p && !open.has(p); p = ogNode(p)?.parentId) open.add(p); });
  const roots = ogKids('');
  const canSeed = S.users.some(u => u.email === SUPER_ADMIN_EMAIL || u.roles?.admin || u.roles?.leader || u.roles?.caller);
  const tree = roots.length
    ? `<ul class="og-list">${roots.map(n => ogItem(n, hits, open)).join('')}</ul>
       <div class="og-root-drop" data-og-rootdrop>여기에 끌어 놓으면 맨 위 줄로 올라가요</div>`
    : `<div class="empty">아직 조직도가 비어 있어요<br><br>
        <button class="btn primary" data-og-addroot>＋ 첫 상자 만들기</button>
        ${canSeed ? '<button class="btn" data-og-seed>역할 등록 명단으로 초안 만들기</button>' : ''}</div>`;
  return `
    <div class="page-title">조직도 <span class="sub">상자 ${OG.nodes.length}개 · 사람 ${OG.nodes.filter(n => ogName(n)).length}명 · 계정 연결 ${OG.nodes.filter(ogUser).length}명 ·
      상자를 끌어 다른 상자 가운데(그 아래로)·위쪽 끝(앞으로)·아래쪽 끝(뒤로)에 놓으면 옮겨져요</span></div>
    <div class="toolbar">
      <input type="search" id="og-search" placeholder="이름·직함·연락처·역할로 찾기" value="${esc(OG.search)}">
      <button class="btn sm" data-og-addroot>＋ 맨 위 상자</button>
      <button class="btn sm" data-og-foldall="0">모두 펼치기</button>
      <button class="btn sm" data-og-foldall="1">모두 접기</button>
      <button class="btn sm" data-og-png ${roots.length ? '' : 'disabled'}>PNG 저장</button>
      <button class="btn sm" data-og-print ${roots.length ? '' : 'disabled'}>인쇄·PDF</button>
    </div>
    ${renderOrgMissing()}
    ${hits ? `<div class="small muted" style="margin:-4px 0 10px">찾은 상자 ${hits.size}개 (점선 표시)</div>` : ''}
    <div class="og-layout">
      <div class="og-tree">${tree}</div>
      ${renderOrgEditor()}
    </div>`;
}

function ogItem(n, hits, open) {
  const ks = ogKids(n.id);
  const shut = ks.length && OG.folded.has(n.id) && !open.has(n.id);
  const u = ogUser(n), name = ogName(n), phone = ogPhone(n);
  const sub = [phone ? fmtPhone(phone) : '', n.note].filter(Boolean).join(' · ');
  const tags = n.uid && !u ? '<span class="badge b-bad">계정 없음</span>'
    : u ? (ogRoleNames(u).map(r => `<span class="badge b-stage">${r}</span>`).join('') || '<span class="badge b-muted">역할 없음</span>')
      + (ogNoLink(u) ? '<span class="badge b-before">링크 없음</span>' : '') : '';
  const cls = (n.color && n.color !== 'none' ? ' og-c-' + n.color : '') + (n.id === OG.sel ? ' on' : '') + (hits && hits.has(n.id) ? ' hit' : '');
  const main = name
    ? esc(name) + (n.title ? `<span class="t">${esc(n.title)}</span>` : '')
    : n.title ? esc(n.title) : '<span class="muted">(빈 상자)</span>';
  return `<li><div class="og-box${cls}" draggable="true" data-og-node="${n.id}">
      <button class="og-fold${ks.length ? '' : ' none'}" data-og-fold="${n.id}" title="${shut ? '펼치기' : '접기'}">${shut ? '+' : '−'}</button>
      <div><div class="og-main">${main}</div>${sub ? `<div class="og-sub">${esc(sub)}</div>` : ''}${tags ? `<div class="og-tags">${tags}</div>` : ''}</div>
      ${shut ? `<span class="og-cnt">+${ogBranch(n.id).length - 1}</span>` : ''}
    </div>${ks.length && !shut ? `<ul class="og-list">${ks.map(k => ogItem(k, hits, open)).join('')}</ul>` : ''}</li>`;
}

function renderOrgEditor() {
  const n = OG.sel && ogNode(OG.sel);
  if (!n) return `<div class="panel og-edit"><h3>상자 편집</h3>
    <p class="small muted" style="line-height:1.8">상자를 누르면 여기서 이름·직함·연락처를 고치고, 그 아래에 사람을 붙일 수 있어요.<br>
    상자를 끌어서 옮길 수도 있어요. 휴대폰에서는 ‘상위 상자’를 바꿔 옮기면 돼요.</p></div>`;
  const f = OG.form;
  const sibs = ogKids(n.parentId || ''), i = sibs.findIndex(x => x.id === n.id);
  const parents = ogFlat().filter(({n: p}) => !ogUnder(p.id, n.id));
  const branch = ogBranch(n.id).length;
  const placed = new Set(OG.nodes.filter(x => x.uid && x.id !== n.id).map(x => x.uid));
  const accounts = [...S.users].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
  const u = f.uid ? S.users.find(x => x.uid === f.uid) : null;
  return `<div class="panel og-edit">
    <h3>상자 편집</h3>
    <div class="field"><label>계정 연결 <span class="muted">— 연결하면 이름·전화번호·역할을 가입자 정보에서 가져와요</span></label><select data-og-f="uid">
      <option value="">(연결 안 함 · 직접 입력)</option>
      ${accounts.map(a => `<option value="${esc(a.uid)}" ${a.uid === f.uid ? 'selected' : ''}>${esc(a.name || a.email)}${a.roles && ogRoleNames(a).length ? ' · ' + ogRoleNames(a).join('·') : ''}${placed.has(a.uid) ? ' (조직도에 있음)' : ''}</option>`).join('')}
    </select></div>
    ${u ? renderOrgAccount(u, f.uid === n.uid) : `
    <div class="field"><label>이름</label><input type="text" data-og-f="name" maxlength="30" value="${esc(f.name)}"></div>
    <div class="field"><label>연락처</label><input type="text" data-og-f="phone" maxlength="20" inputmode="tel" value="${esc(f.phone)}"></div>`}
    <div class="field"><label>직함·부서</label><input type="text" data-og-f="title" maxlength="30" placeholder="예: 대표, 1팀장" value="${esc(f.title)}"></div>
    <div class="field"><label>메모</label><input type="text" data-og-f="note" maxlength="200" placeholder="맡은 일 등" value="${esc(f.note)}"></div>
    <div class="field"><label>색</label><div class="og-swatches">${Object.entries(OG_COLORS).map(([k, [bg, line]]) =>
      `<button style="background:${bg};border-color:${line}" class="${f.color === k ? 'on' : ''}" data-og-color="${k}" title="${k}"></button>`).join('')}</div></div>
    <div class="field"><label>상위 상자</label><select data-og-f="parentId">
      <option value="">(맨 위 줄)</option>
      ${parents.map(({n: p, depth}) => `<option value="${p.id}" ${p.id === f.parentId ? 'selected' : ''}>${'　'.repeat(depth)}${esc(ogLabel(p))}</option>`).join('')}
    </select></div>
    <div class="btn-row">
      <button class="btn primary" data-og-save ${OG.dirty ? '' : 'disabled'}>저장</button>
      <button class="btn" data-og-close>닫기</button>
      ${n.updatedBy ? `<span class="small muted" style="margin-left:auto">${esc(n.updatedBy)} · ${fmt(new Date(n.updatedAt || 0))}</span>` : ''}
    </div>
    <hr>
    <div class="btn-row" style="margin-bottom:8px">
      <button class="btn sm" data-og-add="child">＋ 아래에 붙이기</button>
      <button class="btn sm" data-og-add="sib">＋ 같은 줄에 추가</button>
    </div>
    <div class="btn-row">
      <button class="btn sm" data-og-step="-1" ${i <= 0 ? 'disabled' : ''}>▲ 위로</button>
      <button class="btn sm" data-og-step="1" ${i >= sibs.length - 1 ? 'disabled' : ''}>▼ 아래로</button>
      <button class="btn sm danger" data-og-del style="margin-left:auto">${branch > 1 ? `가지째 지우기 (${branch})` : '지우기'}</button>
    </div>
  </div>`;
}

function renderOrgMissing() {
  const ms = ogMissing();
  if (!ms.length || !OG.nodes.length) return '';
  const where = u => { const r = ogTeamRole(u); return r ? ogTeamBox(r).title : '맨 위 줄'; };
  return `<div class="panel" style="padding:12px 16px">
    <h3 style="margin-bottom:8px">조직도에 없는 사람 ${ms.length}명 <span class="muted small">역할은 있는데 연결된 상자가 없어요 · 넣은 뒤 끌어서 옮길 수 있어요</span>
      <button class="btn sm primary" data-og-placeall style="margin-left:8px">모두 넣기</button></h3>
    ${ms.map(u => `<span class="staff-chip">${esc(u.name || u.email)} <span class="small muted">${ogRoleNames(u).join('·')}</span>
      <button class="btn sm" data-og-place="${esc(u.uid)}" title="${esc(where(u))}에 넣기" style="padding:0 8px;font-size:.74rem">→ ${esc(where(u))}</button></span>`).join('')}
  </div>`;
}

// 연결된 계정 정보 + 역할 체크박스 (역할 등록 탭과 같은 데이터를 바꾼다)
function renderOrgAccount(u, saved) {
  const me = S.me, isSuperRow = u.email === SUPER_ADMIN_EMAIL;
  const tog = ([k, label]) => `<label class="role-toggle"><input type="checkbox" data-og-role="${k}" data-uid="${esc(u.uid)}"
      ${u.roles?.[k] ? 'checked' : ''} ${saved && (k !== 'admin' || me.isSuper) ? '' : 'disabled'}> ${label}</label>`;
  return `<div class="og-acct">
    <div><b>${esc(u.name || '')}</b> <span class="small muted">${esc(fmtPhone(u.phone) || '전화번호 없음')} · ${esc(u.email)}</span></div>
    <div class="hint">이름·전화번호는 역할 등록 탭이나 본인의 ‘내 정보’에서 고쳐요</div>
    <div style="margin-top:8px">${isSuperRow ? '<span class="badge b-stage">최고 관리자</span> ' : ''}${OG_ROLES.filter(([k]) => !(isSuperRow && k === 'admin')).map(tog).join('')}</div>
    ${saved ? '' : '<div class="hint">먼저 저장하면 여기서 역할을 바꿀 수 있어요</div>'}
    ${saved && u.roles?.caller ? `<div class="field" style="margin:10px 0 0"><label>카톡 오픈프로필 ${ogNoLink(u) ? '<span class="badge b-before">링크 없음</span>' : ''}</label>
      <input class="inp" data-og-kakao="${esc(u.uid)}" placeholder="https://open.kakao.com/o/..." value="${esc(u.kakaoLink || '')}"></div>` : ''}
  </div>`;
}

/* ── 조작 ── */
document.addEventListener('change', async e => {
  if (S.tab !== 'org') return;
  const r = e.target.closest('input[data-og-role]');
  if (r) { await setRole(r.dataset.uid, r.dataset.ogRole, r.checked); return; }
  const k = e.target.closest('input[data-og-kakao]');
  if (k && await saveKakaoLink(k.dataset.ogKakao, k.value)) render();
});

const ogLeave = () => !OG.dirty || confirm('고치던 내용을 저장하지 않고 넘어갈까요?');

document.addEventListener('input', e => {
  if (S.tab !== 'org') return;
  const f = e.target.closest('[data-og-f]');
  if (f) {
    OG.form[f.dataset.ogF] = f.value; OG.dirty = true;
    if (f.dataset.ogF === 'uid') { render(); return; }
    const b = $('[data-og-save]'); if (b) b.disabled = false;
    return;
  }
  if (e.target.id === 'og-search') {
    OG.search = e.target.value; render();
    const s = $('#og-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  }
});

document.addEventListener('keydown', e => {
  if (S.tab === 'org' && e.key === 'Enter' && !e.isComposing && e.target.matches('input[data-og-f]')) { e.preventDefault(); ogSave(); }
});

document.addEventListener('click', e => {
  if (S.tab !== 'org' || !OG.nodes) return;
  const t = e.target;
  const fold = t.closest('[data-og-fold]');
  if (fold) {
    const id = fold.dataset.ogFold;
    if (OG.folded.has(id)) OG.folded.delete(id); else OG.folded.add(id);
    ogSaveFolded(); render(); return;
  }
  const box = t.closest('[data-og-node]');
  if (box) {
    if (box.dataset.ogNode !== OG.sel && ogLeave()) { ogSelect(box.dataset.ogNode); render(); }
    return;
  }
  if (t.closest('[data-og-save]')) { ogSave(); return; }
  if (t.closest('[data-og-close]')) { if (ogLeave()) { ogSelect(null); render(); } return; }
  const color = t.closest('[data-og-color]');
  if (color) { OG.form.color = color.dataset.ogColor; OG.dirty = true; render(); return; }
  if (t.closest('[data-og-addroot]')) { if (ogLeave()) ogAdd(''); return; }
  const add = t.closest('[data-og-add]');
  if (add) {
    const n = ogNode(OG.sel);
    if (!ogLeave()) return;
    if (add.dataset.ogAdd === 'child') ogAdd(n.id);
    else ogAdd(n.parentId || '', ogKids(n.parentId || '').findIndex(x => x.id === n.id) + 1);
    return;
  }
  const step = t.closest('[data-og-step]');
  if (step) {
    const n = ogNode(OG.sel), pid = n.parentId || '';
    ogMove(n.id, pid, ogKids(pid).findIndex(x => x.id === n.id) + Number(step.dataset.ogStep));
    return;
  }
  if (t.closest('[data-og-del]')) { ogDelete(OG.sel); return; }
  const fa = t.closest('[data-og-foldall]');
  if (fa) {
    // 모두 접기 = 맨 위 줄과 그 바로 아래만 보이게
    OG.folded = fa.dataset.ogFoldall === '1' ? new Set(OG.nodes.filter(n => n.parentId && ogKids(n.id).length).map(n => n.id)) : new Set();
    ogSaveFolded(); render(); return;
  }
  if (t.closest('[data-og-seed]')) { ogSeed(); return; }
  if (t.closest('[data-og-autolink]')) { ogAutoLink(); return; }
  const pl = t.closest('[data-og-place]');
  if (pl) { const u = S.users.find(x => x.uid === pl.dataset.ogPlace); if (u) ogPlace(u); return; }
  if (t.closest('[data-og-placeall]')) {
    const ms = ogMissing();
    if (!confirm(`${ms.length}명을 역할에 맞는 팀(콜러 → 콜링팀, 리더 → 리더팀, 그 외 → 맨 위 줄)에 넣을까요?`)) return;
    (async () => { for (const u of ms) await ogPlace(u, true); toast(`${ms.length}명을 넣었어요`); })();
    return;
  }
  if (t.closest('[data-og-png]')) { ogDownloadPng(); return; }
  if (t.closest('[data-og-print]')) { ogPrint(); return; }
});

// 끌어 옮기기: 상자 가운데 = 그 아래로, 위쪽 1/4 = 앞으로, 아래쪽 1/4 = 뒤로
function ogDropZone(e) {
  if (!OG.drag) return null;
  const root = e.target.closest?.('[data-og-rootdrop]');
  if (root) return {el: root, id: '', where: 'in'};
  const el = e.target.closest?.('[data-og-node]');
  if (!el || ogUnder(el.dataset.ogNode, OG.drag)) return null;
  const r = el.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
  return {el, id: el.dataset.ogNode, where: y < .25 ? 'before' : y > .75 ? 'after' : 'in'};
}
const ogClearDrop = () => document.querySelectorAll('.drop-in,.drop-before,.drop-after')
  .forEach(x => x.classList.remove('drop-in', 'drop-before', 'drop-after'));

document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-og-node]');
  if (!el) return;
  OG.drag = el.dataset.ogNode;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', OG.drag);
});
document.addEventListener('dragend', () => {
  OG.drag = null; ogClearDrop();
  document.querySelector('.og-box.dragging')?.classList.remove('dragging');
});
document.addEventListener('dragover', e => {
  if (!OG.drag) return;
  const z = ogDropZone(e);
  ogClearDrop();
  if (!z) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  z.el.classList.add('drop-' + z.where);
});
document.addEventListener('drop', e => {
  const z = ogDropZone(e), id = OG.drag;
  if (!id) return;
  e.preventDefault();
  OG.drag = null; ogClearDrop();
  if (!z) return;
  if (z.where === 'in') { ogMove(id, z.id, ogKids(z.id).filter(n => n.id !== id).length); return; }
  const pid = ogNode(z.id).parentId || '';
  const sibs = ogKids(pid).filter(n => n.id !== id);
  ogMove(id, pid, sibs.findIndex(n => n.id === z.id) + (z.where === 'after' ? 1 : 0));
});
</script>
